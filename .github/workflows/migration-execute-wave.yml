name: Parallel Matrix Migration Wave

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Path to migration scope JSON file (or leave default when using scope_run_id / inline source_org & target_org)'
        required: false
        type: string
        default: 'scopes/wave-1.json'
      scope_run_id:
        description: 'Optional GitHub Actions Run ID from generate-scope.yml (or "latest") to download migration-scopes artifact'
        required: false
        type: string
        default: ''
      source_org:
        description: 'Optional inline source organization(s), e.g. "org-a" or "org-a,org-b,org-c" for multi-org consolidation'
        required: false
        type: string
        default: ''
      target_org:
        description: 'Optional inline target organization (used with source_org for 1-click inline scope generation)'
        required: false
        type: string
        default: ''
      repositories:
        description: 'Inline repository selection when using source_org & target_org ("all", "public", "private", "internal", "org_only", or comma-separated repo names)'
        required: false
        type: string
        default: 'all'
      source_visibility:
        description: 'Filter discovered repositories by visibility when using inline source_org & target_org ("all", "public", "private", or "internal")'
        required: false
        type: choice
        options:
          - 'all'
          - 'public'
          - 'private'
          - 'internal'
        default: 'all'
      exclude_forks:
        description: 'Exclude forked repositories when discovering organization repositories inline'
        required: false
        type: boolean
        default: false
      org_items_mode:
        description: 'Organization items mode ("auto" = all for 1:1 / associated-only for multi-org, "associated-only" = only items linked to in-scope repos, "all", or "none")'
        required: false
        type: choice
        options:
          - 'auto'
          - 'associated-only'
          - 'all'
          - 'none'
        default: 'auto'
      target_type:
        description: 'Target tenant type ("ghec" for standard GHEC, "emu" for Enterprise Managed Users)'
        required: false
        type: choice
        options:
          - 'ghec'
          - 'emu'
        default: 'ghec'
      emu_shortcode:
        description: 'Admin-defined EMU shortcode/suffix (e.g. "acme" or "_acme") when target_type is "emu"'
        required: false
        type: string
        default: ''
      discovery_run_id:
        description: 'Optional GitHub Actions Run ID from discovery-scan.yml (or "latest") to download discovery bundle artifact'
        required: false
        type: string
        default: ''
      cached_bundle:
        description: 'Optional path to pre-collected discovery bundle JSON file'
        required: false
        type: string
        default: ''
      runner_capacity:
        description: 'Available runner capacity (determines dynamic cohort count and partitioning)'
        required: false
        type: number
        default: 5
      batch_size:
        description: 'Cohort batch size for parallel runner partitioning'
        required: false
        type: number
        default: 5
      modules:
        description: 'Modules to execute ("auto" for strategy-aware resolution across all 34 modules, "all", or comma-separated module IDs)'
        required: false
        type: string
        default: 'auto'
      dry_run:
        description: 'Execute in dry-run mode (simulates planning & mutations without modifying destination)'
        required: false
        type: boolean
        default: true
      continue_on_error:
        description: 'Continue executing remaining modules/cohorts on non-fatal failures'
        required: false
        type: boolean
        default: true
      runner_labels:
        description: 'Comma-separated labels for runner selection (e.g. "ubuntu-latest" for GitHub-hosted or "self-hosted,linux" for production)'
        required: false
        type: string
        default: 'ubuntu-latest'
      environment_gate:
        description: 'Target GitHub Environment with review protection gates (e.g. "production-migration" or "test")'
        required: false
        type: string
        default: 'production-migration'
      allow_same_credential:
        description: 'Allow source and target tenants to share credentials (required for same-enterprise testing)'
        required: false
        type: boolean
        default: true

env:
  GHEC_ALLOW_SAME_CREDENTIAL: ${{ inputs.allow_same_credential != false && 'true' || 'false' }}

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  slicer:
    name: Partition Scopes & Plan Wave
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.slice.outputs.matrix }}
      cohort_count: ${{ steps.slice.outputs.cohort_count }}
      runner_labels_json: ${{ steps.resolve-runners.outputs.labels_json }}
      resolved_scope_label: ${{ steps.resolve-inputs.outputs.scope_label }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Suite Environment
        uses: ./.github/actions/setup-suite

      - name: Resolve Scope & Discovery Bundle (Artifact, Inline, or Repository File)
        id: resolve-inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_SCOPE_RUN_ID: ${{ inputs.scope_run_id }}
          INPUT_SOURCE_ORG: ${{ inputs.source_org }}
          INPUT_TARGET_ORG: ${{ inputs.target_org }}
          INPUT_REPOS: ${{ inputs.repositories }}
          INPUT_SOURCE_VISIBILITY: ${{ inputs.source_visibility || 'all' }}
          INPUT_EXCLUDE_FORKS: ${{ inputs.exclude_forks }}
          INPUT_ORG_ITEMS_MODE: ${{ inputs.org_items_mode || 'auto' }}
          INPUT_TARGET_TYPE: ${{ inputs.target_type }}
          INPUT_EMU_SHORTCODE: ${{ inputs.emu_shortcode }}
          INPUT_DISCOVERY_RUN_ID: ${{ inputs.discovery_run_id }}
          INPUT_CACHED_BUNDLE: ${{ inputs.cached_bundle }}
        run: |
          mkdir -p ./scans ./downloaded-scope ./downloaded-discovery
          RESOLVED_SCOPE=""

          # Mode 1: Inline 1-Click Scope Generation (when source_org and target_org are provided)
          if [ -n "$INPUT_SOURCE_ORG" ] && [ -n "$INPUT_TARGET_ORG" ]; then
            echo "Generating migration scope inline for $INPUT_SOURCE_ORG -> $INPUT_TARGET_ORG..."
            GEN_ARGS=(
              generate-scope
              --source "$INPUT_SOURCE_ORG"
              --target "$INPUT_TARGET_ORG"
              --target-type "${INPUT_TARGET_TYPE:-ghec}"
              --output ./scans/resolved-scope.json
            )
            if [ -n "$INPUT_EMU_SHORTCODE" ]; then
              GEN_ARGS+=(--emu-shortcode "$INPUT_EMU_SHORTCODE")
            fi
            if [ "$INPUT_EXCLUDE_FORKS" = "true" ]; then
              GEN_ARGS+=(--exclude-forks)
            fi
            if [ -n "$INPUT_ORG_ITEMS_MODE" ] && [ "$INPUT_ORG_ITEMS_MODE" != "auto" ]; then
              GEN_ARGS+=(--org-items "$INPUT_ORG_ITEMS_MODE")
            fi
            if [ "$INPUT_REPOS" = "all" ] || [ -z "$INPUT_REPOS" ]; then
              GEN_ARGS+=(--all --source-visibility "${INPUT_SOURCE_VISIBILITY:-all}")
            elif [ "$INPUT_REPOS" = "public" ] || [ "$INPUT_REPOS" = "private" ] || [ "$INPUT_REPOS" = "internal" ]; then
              GEN_ARGS+=(--all --source-visibility "$INPUT_REPOS")
            elif [ "$INPUT_REPOS" = "org_only" ] || [ "$INPUT_REPOS" = "org_resources_only" ]; then
              GEN_ARGS+=(--org-only)
            else
              GEN_ARGS+=(--repos "$INPUT_REPOS")
            fi
            node ./apps/cli/bin/ghec-consultant-cli.mjs "${GEN_ARGS[@]}"
            RESOLVED_SCOPE="./scans/resolved-scope.json"
            echo "scope_label=inline:${INPUT_SOURCE_ORG}-to-${INPUT_TARGET_ORG}" >> "$GITHUB_OUTPUT"
          fi

          # Mode 2: Download Scope Artifact from generate-scope.yml (explicit scope_run_id or fallback when repo file missing)
          if [ -z "$RESOLVED_SCOPE" ] && { [ -n "$INPUT_SCOPE_RUN_ID" ] || [ ! -f "$INPUT_SCOPE" ]; }; then
            export PATH="$HOME/.local/bin:$PATH"
            TARGET_SCOPE_RUN="$INPUT_SCOPE_RUN_ID"
            if [ -z "$TARGET_SCOPE_RUN" ] || [ "$TARGET_SCOPE_RUN" = "latest" ]; then
              echo "Looking up latest successful generate-scope.yml workflow run..."
              for TOK in "$GH_TOKEN" "$GHEC_SOURCE_TOKEN"; do
                [ -n "$TOK" ] || continue
                TARGET_SCOPE_RUN=$(GH_TOKEN="$TOK" gh run list -R "${{ github.repository }}" --workflow=generate-scope.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
                if [ -z "$TARGET_SCOPE_RUN" ] || [ "$TARGET_SCOPE_RUN" = "null" ]; then
                  TARGET_SCOPE_RUN=$(curl -fsSL -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/generate-scope.yml/runs?status=success&per_page=1" | jq -r '.workflow_runs[0].id // empty' 2>/dev/null || true)
                fi
                if [ -n "$TARGET_SCOPE_RUN" ] && [ "$TARGET_SCOPE_RUN" != "null" ]; then
                  break
                fi
              done
            fi
            if [ -n "$TARGET_SCOPE_RUN" ] && [ "$TARGET_SCOPE_RUN" != "null" ]; then
              echo "Downloading migration-scopes artifact from workflow run $TARGET_SCOPE_RUN..."
              for TOK in "$GH_TOKEN" "$GHEC_SOURCE_TOKEN"; do
                [ -n "$TOK" ] || continue
                if GH_TOKEN="$TOK" gh run download "$TARGET_SCOPE_RUN" -R "${{ github.repository }}" -n migration-scopes --dir ./downloaded-scope 2>/dev/null; then
                  break
                fi
                ART_URL=$(curl -fsSL -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs/${TARGET_SCOPE_RUN}/artifacts" | jq -r '.artifacts[] | select(.name == "migration-scopes") | .archive_download_url' | head -n 1 2>/dev/null || true)
                if [ -n "$ART_URL" ] && [ "$ART_URL" != "null" ]; then
                  if curl -fsSL -L -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json" "$ART_URL" -o ./scans/migration-scopes.zip 2>/dev/null; then
                    python3 -m zipfile -e ./scans/migration-scopes.zip ./downloaded-scope
                    rm -f ./scans/migration-scopes.zip
                    break
                  fi
                fi
              done
              if [ -n "$INPUT_SCOPE" ] && [ -f "./downloaded-scope/$(basename "$INPUT_SCOPE")" ]; then
                FOUND_SCOPE="./downloaded-scope/$(basename "$INPUT_SCOPE")"
              else
                FOUND_SCOPE=$(find ./downloaded-scope/generated-scopes -name '*.json' 2>/dev/null | sort | head -n 1 || true)
                if [ -z "$FOUND_SCOPE" ]; then
                  FOUND_SCOPE=$(find ./downloaded-scope -name '*.json' 2>/dev/null | sort | head -n 1 || true)
                fi
              fi
              if [ -n "$FOUND_SCOPE" ] && [ -f "$FOUND_SCOPE" ]; then
                cp "$FOUND_SCOPE" ./scans/resolved-scope.json
                RESOLVED_SCOPE="./scans/resolved-scope.json"
                echo "scope_label=artifact:${TARGET_SCOPE_RUN}/$(basename "$FOUND_SCOPE")" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

          # Mode 3: Repository Scope File
          if [ -z "$RESOLVED_SCOPE" ]; then
            if [ ! -f "$INPUT_SCOPE" ]; then
              echo "::error::Scope file '$INPUT_SCOPE' does not exist in repository and no scope_run_id artifact or inline source_org/target_org was provided."
              exit 1
            fi
            cp "$INPUT_SCOPE" ./scans/resolved-scope.json
            RESOLVED_SCOPE="./scans/resolved-scope.json"
            echo "scope_label=$INPUT_SCOPE" >> "$GITHUB_OUTPUT"
          fi

          # Optional Discovery Bundle Resolution (Artifact or Repo File)
          if [ -n "$INPUT_CACHED_BUNDLE" ] && [ -f "$INPUT_CACHED_BUNDLE" ]; then
            cp "$INPUT_CACHED_BUNDLE" ./scans/resolved-discovery-bundle.json
          elif [ -n "$INPUT_DISCOVERY_RUN_ID" ]; then
            TARGET_DISC_RUN="$INPUT_DISCOVERY_RUN_ID"
            if [ "$TARGET_DISC_RUN" = "latest" ]; then
              TARGET_DISC_RUN=$(gh run list --workflow=discovery-scan.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            fi
            if [ -n "$TARGET_DISC_RUN" ] && [ "$TARGET_DISC_RUN" != "null" ]; then
              echo "Downloading discovery bundle artifact from workflow run $TARGET_DISC_RUN..."
              if gh run download "$TARGET_DISC_RUN" --dir ./downloaded-discovery 2>/dev/null; then
                FOUND_BUNDLE=$(find ./downloaded-discovery -name 'ghec-discovery-*.json' | sort | head -n 1 || true)
                if [ -n "$FOUND_BUNDLE" ] && [ -f "$FOUND_BUNDLE" ]; then
                  cp "$FOUND_BUNDLE" ./scans/resolved-discovery-bundle.json
                fi
              fi
            fi
          fi

      - name: Validate Migration Scope
        shell: bash
        env:
          INPUT_TARGET_TYPE: ${{ inputs.target_type }}
          INPUT_EMU_SHORTCODE: ${{ inputs.emu_shortcode }}
          INPUT_ORG_ITEMS_MODE: ${{ inputs.org_items_mode || 'auto' }}
        run: |
          VAL_ARGS=(validate-scope --scope ./scans/resolved-scope.json)
          if [ -n "$INPUT_TARGET_TYPE" ]; then
            VAL_ARGS+=(--target-type "$INPUT_TARGET_TYPE")
          fi
          if [ -n "$INPUT_EMU_SHORTCODE" ]; then
            VAL_ARGS+=(--emu-shortcode "$INPUT_EMU_SHORTCODE")
          fi
          if [ -n "$INPUT_ORG_ITEMS_MODE" ] && [ "$INPUT_ORG_ITEMS_MODE" != "auto" ]; then
            VAL_ARGS+=(--org-items "$INPUT_ORG_ITEMS_MODE")
          fi
          node ./apps/cli/bin/ghec-consultant-cli.mjs "${VAL_ARGS[@]}"

      - name: Execute Preflight Evaluation & Credential Audit
        id: preflight
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          INPUT_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
        run: |
          mkdir -p ./scans
          echo "Evaluating source and target preflight readiness..."
          INPUT_ARG=()
          if [ -f ./scans/resolved-discovery-bundle.json ]; then
            INPUT_ARG=(--input ./scans/resolved-discovery-bundle.json)
          fi

          EXIT_CODE=0
          node ./apps/cli/bin/ghec-consultant-cli.mjs preflight \
            --scope ./scans/resolved-scope.json \
            "${INPUT_ARG[@]}" \
            --output ./scans/preflight-report.json \
            --verbose || EXIT_CODE=$?

          if [ "$EXIT_CODE" -ne 0 ]; then
            if [ "$INPUT_CONTINUE_ON_ERROR" = "true" ]; then
              echo "::warning::Preflight evaluation detected repository blockers or warnings (exit code $EXIT_CODE), but continue_on_error is enabled. Proceeding to migration planning."
            else
              echo "::error::Preflight evaluation detected blockers (exit code $EXIT_CODE)."
              exit "$EXIT_CODE"
            fi
          fi

      - name: Resolve Runner Labels JSON
        id: resolve-runners
        shell: bash
        run: |
          RAW_LABELS="${{ inputs.runner_labels }}"
          # Split comma separated labels into JSON array
          LABELS_JSON=$(echo "$RAW_LABELS" | jq -R 'split(",") | map(gsub("^ +| +$"; ""))' -c)
          echo "labels_json=$LABELS_JSON" >> "$GITHUB_OUTPUT"

      - name: Slice Scope into Parallel Matrix Cohorts
        id: slice
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
        run: |
          mkdir -p ./scans ./cohorts

          INPUT_ARG=()
          if [ -f ./scans/resolved-discovery-bundle.json ]; then
            INPUT_ARG=(--input ./scans/resolved-discovery-bundle.json)
          fi

          echo "Generating plan and slicing into cohorts (runner capacity: ${{ inputs.runner_capacity }})..."
          node ./apps/cli/bin/ghec-consultant-cli.mjs plan \
            --scope ./scans/resolved-scope.json \
            "${INPUT_ARG[@]}" \
            --modules "${{ inputs.modules }}" \
            --runner-capacity "${{ inputs.runner_capacity }}" \
            --split-matrix "${{ inputs.batch_size }}" \
            --output-matrix ./scans/migration-matrix.json \
            --output ./scans/migration-plan.json \
            --verbose

          if [ ! -f ./scans/migration-matrix.json ]; then
            echo "::error::Matrix output file ./scans/migration-matrix.json was not generated."
            exit 1
          fi

          # Read matrix content and extract cohorts
          MATRIX_CONTENT=$(jq -c . ./scans/migration-matrix.json)
          COHORT_COUNT=$(echo "$MATRIX_CONTENT" | jq '.include | length')

          echo "Generated $COHORT_COUNT parallel cohorts."
          echo "matrix=$MATRIX_CONTENT" >> "$GITHUB_OUTPUT"
          echo "cohort_count=$COHORT_COUNT" >> "$GITHUB_OUTPUT"

          # Write individual cohort scopes to ./cohorts/ for matrix workers
          echo "$MATRIX_CONTENT" | jq -c '.include[]' | while read -r COHORT; do
            COHORT_ID=$(echo "$COHORT" | jq -r '.cohortId')
            SCOPE_PAYLOAD=$(echo "$COHORT" | jq -r '.scopeJson')
            echo "$SCOPE_PAYLOAD" > "./cohorts/${COHORT_ID}-scope.json"
          done

      - name: Upload Migration Plan & Matrix Cohorts
        uses: actions/upload-artifact@v4
        with:
          name: migration-wave-plan-${{ github.run_id }}
          path: |
            ./scans/resolved-scope.json
            ./scans/resolved-discovery-bundle.json
            ./scans/preflight-report.json
            ./scans/migration-plan.json
            ./scans/migration-matrix.json
            ./cohorts/*-scope.json
          retention-days: 14

  migrate-cohorts:
    name: 'Migrate Cohort: ${{ matrix.cohortId }}'
    needs: [slicer]
    environment: ${{ inputs.environment_gate }}
    runs-on: ${{ fromJson(needs.slicer.outputs.runner_labels_json) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.slicer.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Wave Plan & Cohort Scopes
        uses: actions/download-artifact@v4
        with:
          name: migration-wave-plan-${{ github.run_id }}
          path: .

      - name: Set up Suite Environment
        uses: ./.github/actions/setup-suite
        with:
          install-gei: 'true'

      - name: Execute Cohort Migration
        id: migrate
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          INPUT_CACHED_BUNDLE: ${{ inputs.cached_bundle }}
          INPUT_MODULES: ${{ inputs.modules }}
          MATRIX_COHORT_ID: ${{ matrix.cohortId }}
          MATRIX_REPO_COUNT: ${{ matrix.repoCount }}
        run: |
          mkdir -p ./scans ./migrations
          COHORT_SCOPE="./cohorts/${MATRIX_COHORT_ID}-scope.json"
          REPORT_OUTPUT="./scans/cohort-report-${MATRIX_COHORT_ID}.json"

          DRY_RUN_ARG=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN_ARG=(--dry-run)
          fi

          CONT_ARG=()
          if [ "$INPUT_CONTINUE_ON_ERROR" = "true" ]; then
            CONT_ARG=(--continue-on-error)
          fi

          INPUT_ARG=()
          if [ -f ./scans/resolved-discovery-bundle.json ]; then
            INPUT_ARG=(--input ./scans/resolved-discovery-bundle.json)
          elif [ -n "$INPUT_CACHED_BUNDLE" ] && [ -f "$INPUT_CACHED_BUNDLE" ]; then
            INPUT_ARG=(--input "$INPUT_CACHED_BUNDLE")
          fi

          echo "Executing migration for cohort $MATRIX_COHORT_ID ($MATRIX_REPO_COUNT repositories)..."
          node ./apps/cli/bin/ghec-consultant-cli.mjs migrate \
            --scope "$COHORT_SCOPE" \
            "${INPUT_ARG[@]}" \
            --modules "$INPUT_MODULES" \
            "${DRY_RUN_ARG[@]}" \
            "${CONT_ARG[@]}" \
            --verbose \
            --output "$REPORT_OUTPUT" || true

      - name: Upload Cohort Execution Artifacts & Checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cohort-results-${{ matrix.cohortId }}-${{ github.run_id }}
          path: |
            ./scans/cohort-report-${{ matrix.cohortId }}.json
            ./migrations/
          retention-days: 14

  aggregate-and-verify:
    name: Aggregate Results & Verify Migration
    needs: [slicer, migrate-cohorts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Suite Environment
        uses: ./.github/actions/setup-suite

      - name: Download Wave Plan
        uses: actions/download-artifact@v4
        with:
          name: migration-wave-plan-${{ github.run_id }}
          path: .

      - name: Download All Cohort Results
        uses: actions/download-artifact@v4
        with:
          pattern: cohort-results-*-${{ github.run_id }}
          path: ./downloaded-cohorts
          merge-multiple: true

      - name: Reconcile Post-Cohort GitHub App Repository Bindings
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_MODULES: ${{ inputs.modules }}
        run: |
          mkdir -p ./downloaded-cohorts
          EFFECTIVE_SCOPE="./scans/resolved-scope.json"
          if [ ! -f "$EFFECTIVE_SCOPE" ]; then
            EFFECTIVE_SCOPE="$INPUT_SCOPE"
          fi
          if [ -f "$EFFECTIVE_SCOPE" ] && { [ -z "$INPUT_MODULES" ] || [ "$INPUT_MODULES" = "auto" ] || [ "$INPUT_MODULES" = "all" ] || echo ",$INPUT_MODULES," | grep -q ",apps-inventory,"; }; then
            echo "Reconciling GitHub App repository bindings after all parallel cohorts have completed..."
            node ./apps/cli/bin/ghec-consultant-cli.mjs migrate \
              --scope "$EFFECTIVE_SCOPE" \
              --modules apps-inventory \
              --continue-on-error \
              --verbose \
              --output ./downloaded-cohorts/cohort-report-post-apps-reconcile.json || true
          fi

      - name: Execute Target Verification
        id: verify
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          mkdir -p ./scans
          EFFECTIVE_SCOPE="./scans/resolved-scope.json"
          if [ ! -f "$EFFECTIVE_SCOPE" ]; then
            EFFECTIVE_SCOPE="$INPUT_SCOPE"
          fi

          if [ -f ./scans/migration-plan.json ]; then
            echo "Running post-migration verification against target enterprise..."
            node ./apps/cli/bin/ghec-consultant-cli.mjs verify \
              --plan ./scans/migration-plan.json \
              --scope "$EFFECTIVE_SCOPE" \
              --verbose \
              --output ./scans/verification-report.json || {
                echo "Verification reported discrepancies or failed."
              }
          else
            echo "::warning::Migration plan ./scans/migration-plan.json not found; skipping verify."
          fi

      - name: Agentic Remediation Review
        id: agent-review
        if: always()
        shell: bash
        run: |
          if [ -f ./scans/verification-report.json ]; then
            echo "Running Agentic Remediation Review against verification report..."
            node ./apps/cli/bin/ghec-consultant-cli.mjs agent-review \
              --report ./scans/verification-report.json \
              --execution-reports ./downloaded-cohorts \
              --spec docs/specs/verification-remediation-agent.md \
              --output ./scans/remediation-plan.json \
              --output-markdown ./scans/remediation-plan.md \
              --append-step-summary \
              --verbose || {
                echo "::warning::Agent review completed with warnings or failed."
              }
          fi

      - name: Generate Summary Report
        id: report
        shell: bash
        env:
          INPUT_SCOPE: ${{ needs.slicer.outputs.resolved_scope_label || inputs.scope }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          NEEDS_COHORT_COUNT: ${{ needs.slicer.outputs.cohort_count }}
        run: |
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          echo "## 🚀 Migration Wave Execution Summary" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "- **Scope:** \`$INPUT_SCOPE\`" >> "$SUMMARY_FILE"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "- **Mode:** 🧪 Dry-Run (Simulation)" >> "$SUMMARY_FILE"
          else
            echo "- **Mode:** ⚡ Live Migration" >> "$SUMMARY_FILE"
          fi
          echo "- **Cohorts:** $NEEDS_COHORT_COUNT" >> "$SUMMARY_FILE"
          echo "- **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          echo "### Cohort Execution Breakdown" >> "$SUMMARY_FILE"
          echo "| Cohort ID | Status | Duration (s) | Succeeded Operations | Failed Operations |" >> "$SUMMARY_FILE"
          echo "| :--- | :---: | :---: | :---: | :---: |" >> "$SUMMARY_FILE"

          for REPORT in $(find ./scans ./downloaded-cohorts -name 'cohort-report-*.json' 2>/dev/null); do
            COHORT_NAME=$(basename "$REPORT" .json | sed 's/cohort-report-//')
            STATUS=$(jq -r '.overallStatus // .status // "unknown"' "$REPORT")
            DURATION_MS=$(jq -r '.durationMs // 0' "$REPORT")
            DURATION_SEC=$(awk -v ms="$DURATION_MS" 'BEGIN { printf "%.2f", ms / 1000 }')
            SUCCEEDED=$(jq '[((.results // .moduleResults // [])[]) | (.results // [])[] | select(.status == "succeeded")] | length' "$REPORT" 2>/dev/null || echo 0)
            FAILED=$(jq '[((.results // .moduleResults // [])[]) | (.results // [])[] | select(.status == "failed")] | length' "$REPORT" 2>/dev/null || echo 0)

            STATUS_BADGE="❓ $STATUS"
            if [ "$STATUS" = "complete" ]; then
              STATUS_BADGE="✅ Complete"
            elif [ "$STATUS" = "partial" ]; then
              STATUS_BADGE="⚠️ Partial"
            elif [ "$STATUS" = "failed" ]; then
              STATUS_BADGE="❌ Failed"
            fi

            echo "| \`$COHORT_NAME\` | $STATUS_BADGE | ${DURATION_SEC}s | $SUCCEEDED | $FAILED |" >> "$SUMMARY_FILE"
          done
          echo "" >> "$SUMMARY_FILE"

          if [ -f ./scans/verification-report.json ]; then
            DISCREPANCY_COUNT=$(jq -r '.summary.discrepancyCount // .summary.totalDiscrepancies // .totalDiscrepancies // (.discrepancies | length) // 0' ./scans/verification-report.json)
            UNVERIFIED_COUNT=$(jq -r '.summary.unverifiedModuleCount // .summary.failedModules // 0' ./scans/verification-report.json)
            VERIFIED=$(jq -r 'if (.summary.discrepancyCount // 0) == 0 and (.summary.unverifiedModuleCount // 0) == 0 then "true" else (.verified // "false") end' ./scans/verification-report.json)

            echo "### Post-Migration Target Verification" >> "$SUMMARY_FILE"
            if [ "$VERIFIED" = "true" ] && [ "$DISCREPANCY_COUNT" -eq 0 ] && [ "$UNVERIFIED_COUNT" -eq 0 ]; then
              echo "✅ **Target state strictly verified with 0 discrepancies.**" >> "$SUMMARY_FILE"
            else
              echo "> [!WARNING]" >> "$SUMMARY_FILE"
              echo "> **Verification detected $DISCREPANCY_COUNT discrepancy(ies) and $UNVERIFIED_COUNT unverified module(s) between planned and target state.**" >> "$SUMMARY_FILE"
            fi
            echo "" >> "$SUMMARY_FILE"
          fi

          echo "### Recommended Next Steps" >> "$SUMMARY_FILE"
          echo "1. Review all cohort execution logs and download checkpoint artifacts." >> "$SUMMARY_FILE"
          echo "2. Reclaim mannequins for GHEC-EMU contributors: \`gh gei reclaim-mannequin --skip-invitation\`." >> "$SUMMARY_FILE"
          echo "3. Re-enable organization and repository webhooks after cutover confirmation." >> "$SUMMARY_FILE"

      - name: Publish Migration Results Repository to Target Organization
        id: publish-results
        if: always()
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mkdir -p ./scans/results-repo
          EFFECTIVE_SCOPE="./scans/resolved-scope.json"
          if [ ! -f "$EFFECTIVE_SCOPE" ]; then
            EFFECTIVE_SCOPE="$INPUT_SCOPE"
          fi

          DRY_RUN_FLAGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            if [ -n "${GHEC_TARGET_TOKEN:-}" ]; then
              DRY_RUN_FLAGS=(--dry-run --force-push)
            else
              DRY_RUN_FLAGS=(--dry-run --skip-push)
            fi
          fi

          PLAN_FLAG=()
          if [ -f ./scans/migration-plan.json ]; then
            PLAN_FLAG=(--plan ./scans/migration-plan.json)
          fi

          VERIFY_FLAG=()
          if [ -f ./scans/verification-report.json ]; then
            VERIFY_FLAG=(--verification-report ./scans/verification-report.json)
          fi

          REMEDIATION_FLAG=()
          if [ -f ./scans/remediation-plan.json ]; then
            REMEDIATION_FLAG=(--remediation-plan ./scans/remediation-plan.json)
          fi

          node ./apps/cli/bin/ghec-consultant-cli.mjs publish-results \
            --execution-reports ./downloaded-cohorts,./scans \
            ${EFFECTIVE_SCOPE:+--scope "$EFFECTIVE_SCOPE"} \
            "${PLAN_FLAG[@]}" \
            "${VERIFY_FLAG[@]}" \
            "${REMEDIATION_FLAG[@]}" \
            --evidence-dir ./scans,./downloaded-cohorts \
            --output-dir ./scans/results-repo \
            --append-step-summary \
            --verbose \
            "${DRY_RUN_FLAGS[@]}" || {
              echo "::warning::Publishing migration results repository encountered non-fatal issues."
            }

      - name: Upload Migration Results Repository Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-results-repo-${{ github.run_id }}
          path: ./scans/results-repo
          retention-days: 30

      - name: Upload Final Consolidated Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-wave-final-${{ github.run_id }}
          path: |
            ./scans/preflight-report.json
            ./scans/migration-plan.json
            ./scans/verification-report.json
            ./scans/cohort-report-*.json
            ./scans/remediation-plan.*
            ./scans/results-repo
          retention-days: 30

      - name: Strict Verification & Execution Gate
        id: strict-gate
        if: always()
        shell: bash
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EXPECTED_COHORTS: ${{ needs.slicer.outputs.cohort_count || '0' }}
        run: |
          GATE_FAILED=0
          OBSERVED_COHORTS=$(find ./scans ./downloaded-cohorts -name 'cohort-report-*.json' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$OBSERVED_COHORTS" -lt "${EXPECTED_COHORTS:-0}" ]; then
            echo "::error::Expected $EXPECTED_COHORTS cohort report(s), but only observed $OBSERVED_COHORTS."
            GATE_FAILED=1
          fi

          if [ "$INPUT_DRY_RUN" != "true" ]; then
            if [ ! -f ./scans/verification-report.json ]; then
              echo "::error::Verification report (./scans/verification-report.json) was not generated."
              GATE_FAILED=1
            else
              DISCREPANCIES=$(jq '.summary.discrepancyCount // .summary.totalDiscrepancies // 0' ./scans/verification-report.json)
              UNVERIFIED_MODULES=$(jq '.summary.unverifiedModuleCount // .summary.failedModules // 0' ./scans/verification-report.json)
              if [ "$DISCREPANCIES" -gt 0 ] || [ "$UNVERIFIED_MODULES" -gt 0 ]; then
                echo "::error::Strict Verification Gate Failed: $DISCREPANCIES discrepancy(ies) and $UNVERIFIED_MODULES unverified module(s) remain."
                GATE_FAILED=1
              fi
            fi
          fi

          if [ "$GATE_FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "Strict Verification & Execution Gate passed."
