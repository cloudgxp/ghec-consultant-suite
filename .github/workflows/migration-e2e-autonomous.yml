name: Autonomous Scale-Adaptive Migration & Remediation

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Path to migration scope JSON file (or leave default when using scope_run_id / inline source_org & target_org)'
        required: false
        type: string
        default: 'scopes/wave-1.json'
      scope_run_id:
        description: 'Optional GitHub Actions Run ID from generate-scope.yml (or "latest") to download migration-scopes artifact'
        required: false
        type: string
        default: ''
      source_org:
        description: 'Optional inline source organization(s), e.g. "org-a" or "org-a,org-b,org-c" for multi-org consolidation'
        required: false
        type: string
        default: ''
      target_org:
        description: 'Optional inline target organization (used with source_org for 1-click inline scope generation)'
        required: false
        type: string
        default: ''
      repositories:
        description: 'Inline repository selection when using source_org & target_org ("all", "public", "private", "internal", "org_only", or comma-separated repo names)'
        required: false
        type: string
        default: 'all'
      source_visibility:
        description: 'Filter discovered repositories by visibility when using inline source_org & target_org ("all", "public", "private", or "internal")'
        required: false
        type: choice
        options:
          - 'all'
          - 'public'
          - 'private'
          - 'internal'
        default: 'all'
      exclude_forks:
        description: 'Exclude forked repositories when discovering organization repositories inline'
        required: false
        type: boolean
        default: false
      org_items_mode:
        description: 'Organization items mode ("auto" = all for 1:1 / associated-only for multi-org, "associated-only" = only items linked to in-scope repos, "all", or "none")'
        required: false
        type: choice
        options:
          - 'auto'
          - 'associated-only'
          - 'all'
          - 'none'
        default: 'auto'
      auto_remediate:
        description: 'Automatically execute synthesized remediation plans in closed loop'
        required: false
        type: boolean
        default: true
      max_remediation_rounds:
        description: 'Maximum self-healing retry iterations (closed-loop)'
        required: false
        type: number
        default: 3
      default_runner_labels:
        description: 'Runner pool for standard/small repos (comma-separated or single label, e.g. "ubuntu-latest" or "self-hosted")'
        required: false
        type: string
        default: 'ubuntu-latest'
      large_repo_runner_labels:
        description: 'High-capacity runner pool with >=100 GB scratch disk for large repos (e.g. "ubuntu-latest" or "self-hosted")'
        required: false
        type: string
        default: 'ubuntu-latest'
      dry_run:
        description: 'Execute in dry-run mode (simulates planning & mutations without modifying destination)'
        required: false
        type: boolean
        default: false
      allow_same_credential:
        description: 'Allow source and target tenants to share credentials (for testing)'
        required: false
        type: boolean
        default: true
      modules:
        description: 'Modules to execute ("auto" for strategy-aware resolution, or comma-separated list)'
        required: false
        type: string
        default: 'auto'
      exclude_modules:
        description: 'Optional comma-separated module IDs to exclude (e.g. "teams,post-migration-mannequins")'
        required: false
        type: string
        default: ''
      target_type:
        description: 'Target tenant type ("ghec" for standard GHEC, "emu" for Enterprise Managed Users)'
        required: false
        type: choice
        options:
          - 'ghec'
          - 'emu'
        default: 'ghec'
      emu_shortcode:
        description: 'Admin-defined EMU shortcode/suffix (e.g. "acme" or "_acme") — only used when target_type is "emu"'
        required: false
        type: string
        default: ''
      mirror_push_mode:
        description: 'Mirror-push mode for massive (>2 GiB / >40 GiB) repos ("fast-snapshot" shallow root commit vs "full-history" full clone + windowed commits & tags)'
        required: false
        type: choice
        options:
          - 'fast-snapshot'
          - 'full-history'
        default: 'fast-snapshot'

env:
  GHEC_ALLOW_SAME_CREDENTIAL: ${{ inputs.allow_same_credential != false && 'true' || 'false' }}

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  slicer:
    name: 'Phase 1: Scale-Adaptive Sizing & Strategy Classification'
    runs-on: ${{ inputs.default_runner_labels || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.slice.outputs.matrix }}
      cohort_count: ${{ steps.slice.outputs.cohort_count }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Suite Environment
        uses: ./.github/actions/setup-suite
        with:
          install-gei: 'true'

      - name: Resolve & Validate Migration Scope Contract
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GITHUB_REPO_SLUG: ${{ github.repository }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_SCOPE_RUN_ID: ${{ inputs.scope_run_id }}
          INPUT_SOURCE_ORG: ${{ inputs.source_org }}
          INPUT_TARGET_ORG: ${{ inputs.target_org }}
          INPUT_REPOS: ${{ inputs.repositories }}
          INPUT_SOURCE_VISIBILITY: ${{ inputs.source_visibility || 'all' }}
          INPUT_EXCLUDE_FORKS: ${{ inputs.exclude_forks }}
          INPUT_ORG_ITEMS_MODE: ${{ inputs.org_items_mode || 'auto' }}
          INPUT_TARGET_TYPE: ${{ inputs.target_type || '' }}
          INPUT_EMU_SHORTCODE: ${{ inputs.emu_shortcode || '' }}
          INPUT_MIRROR_PUSH_MODE: ${{ inputs.mirror_push_mode || 'fast-snapshot' }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p ./scans ./downloaded-scope
          RESOLVED_SCOPE=""

          if [ -n "$INPUT_SOURCE_ORG" ] && [ -n "$INPUT_TARGET_ORG" ]; then
            echo "Generating migration scope inline for $INPUT_SOURCE_ORG -> $INPUT_TARGET_ORG..."
            GEN_ARGS=(
              generate-scope
              --source "$INPUT_SOURCE_ORG"
              --target "$INPUT_TARGET_ORG"
              --target-type "${INPUT_TARGET_TYPE:-ghec}"
              --mirror-push-mode "${INPUT_MIRROR_PUSH_MODE:-fast-snapshot}"
              --output ./scans/resolved-scope.json
            )
            if [ -n "$INPUT_EMU_SHORTCODE" ]; then
              GEN_ARGS+=(--emu-shortcode "$INPUT_EMU_SHORTCODE")
            fi
            if [ "$INPUT_EXCLUDE_FORKS" = "true" ]; then
              GEN_ARGS+=(--exclude-forks)
            fi
            if [ -n "$INPUT_ORG_ITEMS_MODE" ] && [ "$INPUT_ORG_ITEMS_MODE" != "auto" ]; then
              GEN_ARGS+=(--org-items "$INPUT_ORG_ITEMS_MODE")
            fi
            if [ "$INPUT_REPOS" = "all" ] || [ -z "$INPUT_REPOS" ]; then
              GEN_ARGS+=(--all --source-visibility "${INPUT_SOURCE_VISIBILITY:-all}")
            elif [ "$INPUT_REPOS" = "public" ] || [ "$INPUT_REPOS" = "private" ] || [ "$INPUT_REPOS" = "internal" ]; then
              GEN_ARGS+=(--all --source-visibility "$INPUT_REPOS")
            elif [ "$INPUT_REPOS" = "org_only" ] || [ "$INPUT_REPOS" = "org_resources_only" ]; then
              GEN_ARGS+=(--org-only)
            else
              GEN_ARGS+=(--repos "$INPUT_REPOS")
            fi
            node ./apps/cli/bin/ghec-consultant-cli.mjs "${GEN_ARGS[@]}"
            RESOLVED_SCOPE="./scans/resolved-scope.json"
          fi

          if [ -z "$RESOLVED_SCOPE" ] && { [ -n "$INPUT_SCOPE_RUN_ID" ] || [ ! -f "$INPUT_SCOPE" ]; }; then
            TARGET_SCOPE_RUN="$INPUT_SCOPE_RUN_ID"
            if [ -z "$TARGET_SCOPE_RUN" ] || [ "$TARGET_SCOPE_RUN" = "latest" ]; then
              echo "Resolving latest successful generate-scope.yml run in $GITHUB_REPO_SLUG..."
              for TOK in "$GH_TOKEN" "$GHEC_SOURCE_TOKEN"; do
                [ -n "$TOK" ] || continue
                TARGET_SCOPE_RUN=$(GH_TOKEN="$TOK" gh run list -R "$GITHUB_REPO_SLUG" --workflow=generate-scope.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
                if [ -z "$TARGET_SCOPE_RUN" ] || [ "$TARGET_SCOPE_RUN" = "null" ]; then
                  TARGET_SCOPE_RUN=$(curl -fsSL -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPO_SLUG}/actions/workflows/generate-scope.yml/runs?status=success&per_page=1" | jq -r '.workflow_runs[0].id // empty' 2>/dev/null || true)
                fi
                if [ -n "$TARGET_SCOPE_RUN" ] && [ "$TARGET_SCOPE_RUN" != "null" ]; then
                  break
                fi
              done
            fi
            if [ -n "$TARGET_SCOPE_RUN" ] && [ "$TARGET_SCOPE_RUN" != "null" ]; then
              echo "Downloading migration-scopes artifact from workflow run $TARGET_SCOPE_RUN..."
              for TOK in "$GH_TOKEN" "$GHEC_SOURCE_TOKEN"; do
                [ -n "$TOK" ] || continue
                if GH_TOKEN="$TOK" gh run download "$TARGET_SCOPE_RUN" -R "$GITHUB_REPO_SLUG" -n migration-scopes --dir ./downloaded-scope 2>/dev/null; then
                  break
                fi
                ART_URL=$(curl -fsSL -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPO_SLUG}/actions/runs/${TARGET_SCOPE_RUN}/artifacts" | jq -r '.artifacts[] | select(.name == "migration-scopes") | .archive_download_url' | head -n 1 2>/dev/null || true)
                if [ -n "$ART_URL" ] && [ "$ART_URL" != "null" ]; then
                  if curl -fsSL -L -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json" "$ART_URL" -o ./scans/migration-scopes.zip 2>/dev/null; then
                    python3 -m zipfile -e ./scans/migration-scopes.zip ./downloaded-scope
                    rm -f ./scans/migration-scopes.zip
                    break
                  fi
                fi
              done
              FOUND_SCOPE=$(find ./downloaded-scope/generated-scopes -name '*.json' 2>/dev/null | sort | head -n 1 || true)
              if [ -z "$FOUND_SCOPE" ]; then
                FOUND_SCOPE=$(find ./downloaded-scope -name '*.json' 2>/dev/null | sort | head -n 1 || true)
              fi
              if [ -n "$FOUND_SCOPE" ] && [ -f "$FOUND_SCOPE" ]; then
                echo "Resolved scope file from artifact: $FOUND_SCOPE"
                cp "$FOUND_SCOPE" ./scans/resolved-scope.json
                RESOLVED_SCOPE="./scans/resolved-scope.json"
              fi
            fi
          fi

          if [ -z "$RESOLVED_SCOPE" ]; then
            if [ ! -f "$INPUT_SCOPE" ]; then
              echo "::error::Scope file '$INPUT_SCOPE' does not exist."
              exit 1
            fi
            cp "$INPUT_SCOPE" ./scans/resolved-scope.json
          fi

          VAL_ARGS=(validate-scope --scope ./scans/resolved-scope.json)
          if [ -n "$INPUT_TARGET_TYPE" ]; then
            VAL_ARGS+=(--target-type "$INPUT_TARGET_TYPE")
          fi
          if [ -n "$INPUT_EMU_SHORTCODE" ]; then
            VAL_ARGS+=(--emu-shortcode "$INPUT_EMU_SHORTCODE")
          fi
          if [ -n "$INPUT_MIRROR_PUSH_MODE" ]; then
            VAL_ARGS+=(--mirror-push-mode "$INPUT_MIRROR_PUSH_MODE")
          fi
          if [ -n "$INPUT_ORG_ITEMS_MODE" ] && [ "$INPUT_ORG_ITEMS_MODE" != "auto" ]; then
            VAL_ARGS+=(--org-items "$INPUT_ORG_ITEMS_MODE")
          fi
          node ./apps/cli/bin/ghec-consultant-cli.mjs "${VAL_ARGS[@]}"

      - name: Execute Preflight Readiness Gate
        id: preflight
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          SCOPE_FILE: ./scans/resolved-scope.json
        run: |
          mkdir -p ./scans
          echo "Running preflight readiness checks on Actions Runner..."
          node ./apps/cli/bin/ghec-consultant-cli.mjs preflight \
            --scope "$SCOPE_FILE" \
            --output ./scans/preflight-report.json \
            --verbose || true

      - name: Bootstrap Organization-Level Prerequisites (Pre-Cohort)
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          SCOPE_FILE: ./scans/resolved-scope.json
        run: |
          mkdir -p ./scans
          node --input-type=module -e '
            import fs from "node:fs";
            const scope = JSON.parse(fs.readFileSync(process.env.SCOPE_FILE, "utf8"));
            const orgPrereqScope = {
              ...scope,
              organizations: (scope.organizations || []).map(o => ({
                ...o,
                modules: (o.modules || []).filter(m =>
                  m !== "org-rulesets" &&
                  m !== "packages" &&
                  m !== "actions-runners" &&
                  m !== "post-migration-mannequins"
                ),
              })),
            };
            fs.writeFileSync("./scans/org-prereq-scope.json", JSON.stringify(orgPrereqScope, null, 2), "utf8");
          '
          echo "Bootstrapping organization prerequisites (custom properties, custom roles, teams, variables, secrets, settings, policies, webhooks, ip-allow-lists, apps, projects-v2) before repository cohorts..."
          node ./apps/cli/bin/ghec-consultant-cli.mjs migrate \
            --scope ./scans/org-prereq-scope.json \
            --modules org-custom-properties,custom-roles,teams,org-variables,org-secrets,org-settings,actions-policies,org-webhooks,ip-allow-lists,apps-inventory,projects-v2 \
            --continue-on-error \
            --verbose \
            --output ./scans/pre-cohort-org-report.json || true

      - name: Diagnose Repository Sizes & Generate Slicer Matrix
        id: slice
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          SCOPE_FILE: ./scans/resolved-scope.json
          DEFAULT_RUNNERS: ${{ inputs.default_runner_labels }}
          LARGE_RUNNERS: ${{ inputs.large_repo_runner_labels }}
        run: |
          mkdir -p ./scans ./cohorts
          node --input-type=module -e '
            import fs from "node:fs";
            import { sliceScaleAdaptiveMatrix } from "./packages/migration/dist/index.js";

            const scope = JSON.parse(fs.readFileSync(process.env.SCOPE_FILE, "utf8"));
            const repos = scope.repositories || [];
            const defaultLabels = process.env.DEFAULT_RUNNERS.split(",").map(s => s.trim()).filter(Boolean);
            const largeLabels = process.env.LARGE_RUNNERS.split(",").map(s => s.trim()).filter(Boolean);
            const sourceToken = process.env.GHEC_SOURCE_TOKEN;
            const defaultSourceOrg = scope.organizations?.[0]?.source;

            let preflightMap = new Map();
            if (fs.existsSync("./scans/preflight-report.json")) {
              try {
                const preflight = JSON.parse(fs.readFileSync("./scans/preflight-report.json", "utf8"));
                for (const a of preflight.repositoryAssessments || []) {
                  preflightMap.set(a.repo, a);
                }
              } catch {}
            }

            // Generate sizing profiles (combining metadata, preflight report, and live API query estimates)
            const profiles = [];
            for (const r of repos) {
              const name = typeof r === "string" ? r : (r.sourceRepo || r.name);
              const sourceOrg = (typeof r === "object" && r.sourceOrg) ? r.sourceOrg : defaultSourceOrg;
              const pf = preflightMap.get(name);
              let diskUsage = (typeof r === "object" && r.diskUsageBytes) ? r.diskUsageBytes : (pf?.gitSizeBytes || 0);
              let visibility = (typeof r === "object" && (r.targetRepoVisibility || r.visibility)) ? (r.targetRepoVisibility || r.visibility) : "private";

              if (!diskUsage && sourceToken && sourceOrg && name) {
                try {
                  const resp = await fetch(`https://api.github.com/repos/${sourceOrg}/${name}`, {
                    headers: {
                      Authorization: `Bearer ${sourceToken}`,
                      Accept: "application/vnd.github+json",
                    },
                  });
                  if (resp.ok) {
                    const data = await resp.json();
                    diskUsage = (data.size || 0) * 1024;
                    if (data.visibility && !(typeof r === "object" && (r.targetRepoVisibility || r.visibility))) {
                      visibility = data.visibility;
                    }
                  }
                } catch {
                  // Fallback to default sizing if API probe fails
                }
              }

              if (!diskUsage) {
                diskUsage = 500 * 1024 * 1024;
              }
              if (typeof r === "object" && (r.gitTransferStrategy === "mirror-push" || r.options?.gitTransferStrategy === "mirror-push")) {
                diskUsage = Math.max(diskUsage, 45 * 1024 * 1024 * 1024);
              }

              const releaseBytes = (typeof r === "object" && r.releaseAssetsBytes) ? r.releaseAssetsBytes : (pf?.releaseTotalAssetBytes || 0);
              const lfsCount = (typeof r === "object" && r.lfsObjectCount) ? r.lfsObjectCount : (pf?.lfsObjectCount || 0);

              profiles.push({
                repositoryName: name,
                gitDiskUsageBytes: diskUsage,
                gitLfsObjectCount: lfsCount,
                gitLfsTotalBytes: pf?.lfsTotalBytes || (lfsCount > 0 ? 1048576 : 0),
                releaseCount: pf?.releaseCount || (releaseBytes > 0 ? 1 : 0),
                releaseAssetsTotalBytes: releaseBytes,
                estimatedScratchBytes: Math.ceil(diskUsage * 1.5 + (releaseBytes > 10 * 1024 * 1024 * 1024 ? 0 : releaseBytes)),
                sourceVisibility: visibility,
              });
            }

            const matrixOutput = sliceScaleAdaptiveMatrix(profiles, {
              defaultRunnerLabels: defaultLabels,
              largeRepoRunnerLabels: largeLabels,
              batchSize: 5,
              massiveBatchSize: 1,
            });

            fs.writeFileSync("./scans/slicer-matrix.json", JSON.stringify(matrixOutput, null, 2), "utf8");

            const mirrorPushRepoNames = new Set(
              matrixOutput.matrix.include
                .filter(c => c.useMirrorPush)
                .flatMap(c => c.repositories)
            );
            scope.repositories = (scope.repositories || []).map(r => {
              if (typeof r !== "object" || !r) return r;
              const name = r.sourceRepo || r.name;
              const prof = profiles.find(p => p.repositoryName === name);
              const repoUseMirrorPush = Boolean(
                r.gitTransferStrategy === "mirror-push" ||
                r.options?.gitTransferStrategy === "mirror-push" ||
                mirrorPushRepoNames.has(name)
              );
              const repoSkipReleases = Boolean(
                r.skipReleases ||
                r.options?.skipReleases ||
                repoUseMirrorPush ||
                (prof && prof.releaseAssetsTotalBytes > 10 * 1024 * 1024 * 1024)
              );
              return {
                ...r,
                ...(repoUseMirrorPush ? { gitTransferStrategy: "mirror-push" } : {}),
                ...(repoSkipReleases ? { skipReleases: true } : {}),
              };
            });
            fs.writeFileSync(process.env.SCOPE_FILE, JSON.stringify(scope, null, 2), "utf8");

            // Write individual cohort scopes (org modules are bootstrapped pre-cohort and reconciled post-cohort)
            matrixOutput.matrix.include.forEach((cohort) => {
              const cohortScope = {
                ...scope,
                organizations: (scope.organizations || []).map(o => ({ ...o, modules: [] })),
                repositories: scope.repositories
                  .filter(r => {
                    const name = typeof r === "string" ? r : (r.sourceRepo || r.name);
                    return cohort.repositories.includes(name);
                  })
              };
              fs.writeFileSync(`./cohorts/${cohort.cohortId}-scope.json`, JSON.stringify(cohortScope, null, 2), "utf8");
            });

            console.log(`Generated ${matrixOutput.cohortCount} scale-adaptive cohorts.`);
          '

          MATRIX_JSON=$(jq -c .matrix ./scans/slicer-matrix.json)
          COHORT_COUNT=$(jq '.cohortCount' ./scans/slicer-matrix.json)

          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "cohort_count=$COHORT_COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload Slicer Matrix & Cohort Scopes
        uses: actions/upload-artifact@v4
        with:
          name: slicer-matrix-${{ github.run_id }}
          path: |
            ./scans/resolved-scope.json
            ./scans/preflight-report.json
            ./scans/pre-cohort-org-report.json
            ./scans/slicer-matrix.json
            ./cohorts/*-scope.json
          retention-days: 14

  migrate-cohorts:
    name: 'Phase 2: Migrate Cohort [${{ matrix.cohortId }}]'
    needs: [slicer]
    runs-on: ${{ matrix.runnerLabels }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.slicer.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Cohort Scope
        uses: actions/download-artifact@v4
        with:
          name: slicer-matrix-${{ github.run_id }}
          path: .

      - name: Set up Suite Environment
        uses: ./.github/actions/setup-suite
        with:
          install-gei: ${{ matrix.useGei && 'true' || 'false' }}

      - name: Runner Scratch Disk Headroom Check
        if: ${{ matrix.requiresHeadroomCheck }}
        shell: bash
        run: |
          echo "Verifying scratch disk headroom for massive repository migration..."
          node --input-type=module -e '
            import { assertScratchDiskSpace } from "./packages/migration/dist/index.js";
            const estimatedBytes = ${{ matrix.estimatedScratchBytes }} || 45 * 1024 * 1024 * 1024;
            const mirrorPushMode = "${{ inputs.mirror_push_mode || 'fast-snapshot' }}";
            const effectiveBytes = mirrorPushMode === "full-history"
              ? estimatedBytes
              : Math.min(estimatedBytes, 30 * 1024 * 1024 * 1024);
            const check = assertScratchDiskSpace(process.cwd(), effectiveBytes, 1.0);
            console.log(`Scratch disk check passed (mode=${mirrorPushMode}): ${(check.freeBytes / 1024**3).toFixed(2)} GiB available (required: ${(check.requiredBytes / 1024**3).toFixed(2)} GiB).`);
          '

      - name: Execute Cohort Migration & Transfer Strategies
        id: execute-cohort
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          GHEC_SCRATCH_DIR: ${{ runner.temp }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MODULES: ${{ inputs.modules || 'auto' }}
          INPUT_EXCLUDE_MODULES: ${{ inputs.exclude_modules || '' }}
          MATRIX_COHORT_ID: ${{ matrix.cohortId }}
          USE_GEI: ${{ matrix.useGei }}
          SKIP_RELEASES: ${{ matrix.skipReleases }}
          USE_RELEASE_FALLBACK: ${{ matrix.useReleaseFallback }}
          USE_LFS_STREAMER: ${{ matrix.useLfsStreamer }}
          USE_MIRROR_PUSH: ${{ matrix.useMirrorPush }}
        run: |
          mkdir -p ./scans ./migrations
          COHORT_SCOPE="./cohorts/${MATRIX_COHORT_ID}-scope.json"
          REPORT_OUTPUT="./scans/cohort-report-${MATRIX_COHORT_ID}.json"

          EXTRA_ARGS=(--modules "${INPUT_MODULES:-auto}")
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi
          if [ -n "$INPUT_EXCLUDE_MODULES" ]; then
            EXTRA_ARGS+=(--exclude-modules "$INPUT_EXCLUDE_MODULES")
          fi

          echo "Executing migration for cohort $MATRIX_COHORT_ID (modules=${INPUT_MODULES:-auto}, exclude=${INPUT_EXCLUDE_MODULES:-none})..."
          node ./apps/cli/bin/ghec-consultant-cli.mjs migrate \
            --scope "$COHORT_SCOPE" \
            "${EXTRA_ARGS[@]}" \
            --continue-on-error \
            --verbose \
            --checkpoint-dir ./migrations/ \
            --output "$REPORT_OUTPUT" || true

          if [ -f "$REPORT_OUTPUT" ]; then
            echo "Cohort $MATRIX_COHORT_ID execution summary:"
            jq '{status, exitCode, totalModules: (.results | length), complete: ([.results[] | select(.status == "complete")] | length), partial: ([.results[] | select(.status == "partial")] | length), skipped: ([.results[] | select(.status == "skipped")] | length), failed: ([.results[] | select(.status == "failed")] | length), failedModules: [.results[] | select(.status == "failed" or .status == "partial") | {moduleId, status, failedOps: [.results[] | select(.status == "failed")]}]}' "$REPORT_OUTPUT" || true
          fi

      - name: Post-GEI Visibility Restoration Reconciliation
        if: always() && inputs.dry_run == false
        shell: bash
        env:
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          MATRIX_COHORT_ID: ${{ matrix.cohortId }}
        run: |
          export COHORT_SCOPE="./cohorts/${MATRIX_COHORT_ID}-scope.json"
          if [ -f "$COHORT_SCOPE" ]; then
            echo "Reconciling target repository visibility..."
            node --input-type=module -e '
              import fs from "node:fs";
              import { HttpTargetWriteClient, reconcilePostGeiVisibility } from "./packages/migration/dist/index.js";

              const scope = JSON.parse(fs.readFileSync(process.env.COHORT_SCOPE, "utf8"));
              const token = process.env.GHEC_TARGET_TOKEN;
              if (!token) process.exit(0);

              const targetWriteClient = new HttpTargetWriteClient({ token });

              const defaultTargetOrg = scope.organizations?.[0]?.target || scope.targetOrg;
              for (const repo of scope.repositories || []) {
                const name = typeof repo === "string" ? repo : (repo.targetRepo || repo.sourceRepo || repo.name);
                const targetOrg = (typeof repo === "object" && repo.targetOrg) ? repo.targetOrg : defaultTargetOrg;
                const vis = (typeof repo === "object" && (repo.targetRepoVisibility || repo.visibility || repo.options?.targetRepoVisibility)) ? (repo.targetRepoVisibility || repo.visibility || repo.options?.targetRepoVisibility) : "private";
                if (vis !== "private" && targetOrg && name) {
                  console.log(`Restoring visibility to ${vis} for ${targetOrg}/${name}...`);
                  await reconcilePostGeiVisibility(targetWriteClient, targetOrg, name, vis);
                }
              }
            '
          fi

      - name: Upload Cohort Checkpoints & Execution Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cohort-artifacts-${{ matrix.cohortId }}-${{ github.run_id }}
          path: |
            ./scans/cohort-report-${{ matrix.cohortId }}.json
            ./migrations/
          retention-days: 14

  verification-and-remediation:
    name: 'Phase 3 & 4: Verification & Autonomous Closed-Loop Self-Healing'
    needs: [slicer, migrate-cohorts]
    if: always()
    runs-on: ${{ inputs.default_runner_labels || 'ubuntu-latest' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Suite Environment
        uses: ./.github/actions/setup-suite
        with:
          install-gei: 'true'

      - name: Download Slicer Pre-Cohort Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: slicer-matrix-${{ github.run_id }}
          path: ./downloaded-slicer

      - name: Download Cohort Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cohort-artifacts-*-${{ github.run_id }}
          path: ./downloaded-cohorts
          merge-multiple: true

      - name: Aggregate Cohort Execution Reports
        id: aggregate-cohorts
        if: always()
        shell: bash
        env:
          EXPECTED_COHORT_COUNT: ${{ needs.slicer.outputs.cohort_count || '0' }}
        run: |
          mkdir -p ./scans ./scopes
          if [ -f ./downloaded-slicer/scans/resolved-scope.json ]; then
            cp ./downloaded-slicer/scans/resolved-scope.json ./scans/resolved-scope.json
            SCOPE_NAME=$(jq -r '.name // ""' ./scans/resolved-scope.json 2>/dev/null || true)
            if [ -n "$SCOPE_NAME" ] && [ "$SCOPE_NAME" != "null" ]; then
              cp ./scans/resolved-scope.json "./scopes/${SCOPE_NAME}.json"
            fi
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";

            function findReports(dir) {
              if (!fs.existsSync(dir)) return [];
              const out = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) out.push(...findReports(full));
                else if (/^cohort-report-.*\.json$/i.test(entry.name)) out.push(full);
              }
              return out.sort();
            }

            const expectedCohortCount = Math.max(0, Number.parseInt(process.env.EXPECTED_COHORT_COUNT || "0", 10) || 0);
            const files = findReports("./downloaded-cohorts");
            const observedCohortCount = files.length;
            const missingCohortReports = Math.max(0, expectedCohortCount - observedCohortCount);
            let failedCohortCount = 0;
            let failedModuleCount = 0;
            const failures = [];

            for (const file of files) {
              try {
                const raw = JSON.parse(fs.readFileSync(file, "utf8"));
                const results = Array.isArray(raw.results) ? raw.results : (Array.isArray(raw.moduleResults) ? raw.moduleResults : []);
                const healedInCohort = new Set();
                for (const mod of results) {
                  if (mod.status === "complete" || mod.status === "skipped") {
                    healedInCohort.add(`${mod.moduleId}::${mod.targetIdentifier || ""}`);
                  }
                }
                let cohortHasFailure = raw.overallStatus === "failed" || raw.overallStatus === "partial" || raw.status === "failed" || raw.status === "partial";
                for (const mod of results) {
                  const failedOps = (Array.isArray(mod.results) ? mod.results : []).filter(op => op.status === "failed");
                  const isHealedGeiMetadataFallback =
                    mod.moduleId === "gei-repo" &&
                    mod.status === "partial" &&
                    failedOps.length === 0 &&
                    Array.isArray(mod.failedMetadataCategories) &&
                    mod.failedMetadataCategories.length > 0 &&
                    mod.failedMetadataCategories.every(cat => healedInCohort.has(`${cat}::${mod.targetIdentifier || ""}`));
                  if ((mod.status === "failed" || mod.status === "partial" || failedOps.length > 0) && !isHealedGeiMetadataFallback) {
                    cohortHasFailure = true;
                    failedModuleCount++;
                    failures.push({
                      cohortFile: file,
                      moduleId: mod.moduleId || "unknown",
                      ...(mod.targetIdentifier ? { targetIdentifier: mod.targetIdentifier } : {}),
                      status: mod.status || "failed",
                      failedOperations: failedOps.map(op => ({
                        operationId: op.operationId || "unknown",
                        status: op.status || "failed",
                        ...(typeof op.httpStatus === "number" ? { httpStatus: op.httpStatus } : {}),
                        ...(op.error ? { error: op.error } : {}),
                        ...(op.resourceName ? { resourceName: op.resourceName } : {}),
                        ...(op.targetIdentifier ? { targetIdentifier: op.targetIdentifier } : {}),
                      })),
                    });
                  }
                }
                if (cohortHasFailure) failedCohortCount++;
              } catch (err) {
                failedCohortCount++;
                failedModuleCount++;
                failures.push({
                  cohortFile: file,
                  moduleId: "cohort-report-parse",
                  status: "failed",
                  failedOperations: [{ operationId: "json-parse", status: "failed", error: String(err) }],
                });
              }
            }

            const aggregated = {
              expectedCohortCount,
              observedCohortCount,
              missingCohortReports,
              failedCohortCount,
              failedModuleCount,
              failures,
            };

            fs.writeFileSync("./scans/aggregated-cohort-failures.json", JSON.stringify(aggregated, null, 2), "utf8");
            console.log(`Cohort aggregation complete: observed=${observedCohortCount}/${expectedCohortCount}, failedCohorts=${failedCohortCount}, failedModules=${failedModuleCount}`);
            for (const f of failures) {
              const target = f.targetIdentifier ? ` @ ${f.targetIdentifier}` : "";
              console.log(`  - [${f.moduleId}${target}] (${f.cohortFile}): status=${f.status}, failedOps=${f.failedOperations.length}`);
              for (const op of f.failedOperations) {
                console.log(`      * ${op.operationId}: ${op.error || "failed"}`);
              }
            }

            if (process.env.GITHUB_STEP_SUMMARY && (failedModuleCount > 0 || missingCohortReports > 0)) {
              const summaryLines = [
                "### ⚠️ Phase 2 Cohort Execution Failures",
                "",
                `- **Expected Cohorts**: \`${expectedCohortCount}\` | **Observed Reports**: \`${observedCohortCount}\` | **Missing Reports**: \`${missingCohortReports}\``,
                `- **Failed Cohorts**: \`${failedCohortCount}\` | **Failed Module Executions**: \`${failedModuleCount}\``,
                "",
              ];
              for (const f of failures) {
                const target = f.targetIdentifier ? ` @ ${f.targetIdentifier}` : "";
                const opDetails = f.failedOperations.map(op => `${op.operationId}: ${op.error || "failed"}`).join("; ");
                summaryLines.push(`- \`[${f.moduleId}${target}]\` (${path.basename(f.cohortFile)}): status=\`${f.status}\`${opDetails ? ` — ${opDetails}` : ""}`);
              }
              summaryLines.push("");
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summaryLines.join("\n"), "utf8");
            }
          '

      - name: Reconcile Cross-Cohort Organization & Package Modules
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_TARGET_TYPE: ${{ inputs.target_type || '' }}
          INPUT_EMU_SHORTCODE: ${{ inputs.emu_shortcode || '' }}
        run: |
          EFFECTIVE_SCOPE="./scans/resolved-scope.json"
          if [ ! -f "$EFFECTIVE_SCOPE" ]; then
            EFFECTIVE_SCOPE="$INPUT_SCOPE"
          fi
          echo "Reconciling all organization-scoped modules (including teams, packages, actions-runners, org-rulesets, post-migration-mannequins) after all cohort repositories have unlocked..."
          node ./apps/cli/bin/ghec-consultant-cli.mjs migrate \
            --scope "$EFFECTIVE_SCOPE" \
            --modules org-custom-properties,custom-roles,teams,packages,actions-runners,org-rulesets,org-webhooks,org-variables,org-secrets,org-settings,actions-policies,ip-allow-lists,apps-inventory,projects-v2,post-migration-mannequins \
            --continue-on-error \
            --verbose \
            --output ./scans/post-cohort-reconcile-report.json || true

      - name: Execute Full-Spectrum Verification
        id: initial-verify
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_MODULES: ${{ inputs.modules || 'auto' }}
          INPUT_EXCLUDE_MODULES: ${{ inputs.exclude_modules || '' }}
        run: |
          mkdir -p ./scans
          EFFECTIVE_SCOPE="./scans/resolved-scope.json"
          if [ ! -f "$EFFECTIVE_SCOPE" ]; then
            EFFECTIVE_SCOPE="$INPUT_SCOPE"
          fi
          VERIFY_ARGS=(--modules "${INPUT_MODULES:-auto}")
          if [ -n "$INPUT_EXCLUDE_MODULES" ]; then
            VERIFY_ARGS+=(--exclude-modules "$INPUT_EXCLUDE_MODULES")
          fi
          echo "Executing initial target verification (modules=${INPUT_MODULES:-auto}, exclude=${INPUT_EXCLUDE_MODULES:-none})..."
          node ./apps/cli/bin/ghec-consultant-cli.mjs verify \
            --scope "$EFFECTIVE_SCOPE" \
            "${VERIFY_ARGS[@]}" \
            --output ./scans/verification-report.json \
            --verbose || true

      - name: Autonomous Closed-Loop Self-Healing Loop
        if: ${{ inputs.auto_remediate && inputs.dry_run == false }}
        id: self-heal
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          GHEC_SCRATCH_DIR: ${{ runner.temp }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_MODULES: ${{ inputs.modules || 'auto' }}
          INPUT_EXCLUDE_MODULES: ${{ inputs.exclude_modules || '' }}
          MAX_ROUNDS: ${{ inputs.max_remediation_rounds }}
        run: |
          mkdir -p ./scans ./remediations
          EFFECTIVE_SCOPE="./scans/resolved-scope.json"
          if [ ! -f "$EFFECTIVE_SCOPE" ]; then
            EFFECTIVE_SCOPE="$INPUT_SCOPE"
          fi
          if [ ! -f ./scans/verification-report.json ]; then
            echo "Verification report was not generated; skipping remediation loop."
            exit 0
          fi
          VERIFY_ARGS=(--modules "${INPUT_MODULES:-auto}")
          if [ -n "$INPUT_EXCLUDE_MODULES" ]; then
            VERIFY_ARGS+=(--exclude-modules "$INPUT_EXCLUDE_MODULES")
          fi
          ROUND=1
          MAX_ROUNDS=${MAX_ROUNDS:-3}
          PREV_REMAINING=$(jq '.summary.discrepancyCount // .summary.totalDiscrepancies // 0' ./scans/verification-report.json)
          FAILED_COHORT_MODULES=$(jq '.failedModuleCount // 0' ./scans/aggregated-cohort-failures.json 2>/dev/null || echo 0)
          if [ "$PREV_REMAINING" -eq 0 ] && [ "$FAILED_COHORT_MODULES" -eq 0 ]; then
            echo "Initial verification reported 0 discrepancies and 0 cohort apply() failures. Skipping remediation loop."
            exit 0
          fi

          while [ "$ROUND" -le "$MAX_ROUNDS" ]; do
            echo "=================================================="
            echo "Starting Autonomous Remediation Round $ROUND of $MAX_ROUNDS"
            echo "=================================================="

            # 1. Synthesize remediation plan from latest verification report & cohort execution reports
            node ./apps/cli/bin/ghec-consultant-cli.mjs agent-review \
              --report ./scans/verification-report.json \
              --execution-reports ./downloaded-cohorts,./downloaded-slicer/scans/pre-cohort-org-report.json,./scans/post-cohort-reconcile-report.json \
              --output "./remediations/remediation-plan-round-${ROUND}.json" \
              --output-markdown "./remediations/remediation-plan-round-${ROUND}.md" \
              --verbose

            PLAN_FILE="./remediations/remediation-plan-round-${ROUND}.json"
            ACTION_COUNT=$(jq '.actionableCount // 0' "$PLAN_FILE")
            echo "Round $ROUND identified $ACTION_COUNT actionable discrepancies."

            if [ "$ACTION_COUNT" -eq 0 ]; then
              echo "Zero actionable discrepancies remaining. Remediation loop satisfied."
              break
            fi

            # 2. Extract and execute remediation bash script with structured execution logging
            SCRIPT_CONTENT=$(jq -r '.script // ""' "$PLAN_FILE")
            if [ -n "$SCRIPT_CONTENT" ] && [ "$SCRIPT_CONTENT" != "null" ]; then
              echo "$SCRIPT_CONTENT" > "./remediations/remediation-round-${ROUND}.sh"
              chmod +x "./remediations/remediation-round-${ROUND}.sh"
              echo "Executing remediation script for round $ROUND..."
              set +e
              bash "./remediations/remediation-round-${ROUND}.sh" 2>&1 | tee "./remediations/round-${ROUND}-execution.log"
              REM_EXIT=${PIPESTATUS[0]}
              echo "Remediation round $ROUND script exited with code $REM_EXIT" | tee -a "./remediations/round-${ROUND}-execution.log"
              set -e
            fi

            # 3. Re-verify target state
            echo "Re-running target verification after round $ROUND..."
            node ./apps/cli/bin/ghec-consultant-cli.mjs verify \
              --scope "$EFFECTIVE_SCOPE" \
              "${VERIFY_ARGS[@]}" \
              --output ./scans/verification-report.json \
              --verbose || true

            REMAINING=$(jq '.summary.discrepancyCount // .summary.totalDiscrepancies // 0' ./scans/verification-report.json)
            echo "Verification post-round $ROUND reported $REMAINING discrepancies."

            if [ "$REMAINING" -eq 0 ]; then
              echo "All verification discrepancies resolved to 0!"
              break
            fi

            if [ -n "${PREV_REMAINING:-}" ] && [ "$PREV_REMAINING" -gt 0 ] && [ "$REMAINING" -ge "$PREV_REMAINING" ]; then
              echo "Discrepancy count plateaued ($REMAINING vs previous $PREV_REMAINING); stopping remediation loop early."
              break
            fi
            PREV_REMAINING="$REMAINING"

            ROUND=$((ROUND + 1))
          done

      - name: Publish Migration Audit Repository to Target Organization
        if: always()
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            : > "$GITHUB_STEP_SUMMARY"
          fi
          EFFECTIVE_SCOPE="./scans/resolved-scope.json"
          if [ ! -f "$EFFECTIVE_SCOPE" ]; then
            EFFECTIVE_SCOPE="$INPUT_SCOPE"
          fi
          EXEC_REPORTS="./downloaded-cohorts"
          if [ -f ./downloaded-slicer/scans/pre-cohort-org-report.json ]; then
            EXEC_REPORTS="./downloaded-slicer/scans/pre-cohort-org-report.json,${EXEC_REPORTS}"
          fi
          if [ -f ./scans/post-cohort-reconcile-report.json ]; then
            EXEC_REPORTS="${EXEC_REPORTS},./scans/post-cohort-reconcile-report.json"
          fi
          for REM_EXEC in $(ls -1 ./scans/remediation-execution-*.json 2>/dev/null | sort -V || true); do
            if [ -f "$REM_EXEC" ]; then
              EXEC_REPORTS="${EXEC_REPORTS},${REM_EXEC}"
            fi
          done
          if [ -f ./scans/migration-execution.json ]; then
            EXEC_REPORTS="${EXEC_REPORTS},./scans/migration-execution.json"
          fi

          VERIFY_ARGS=()
          if [ -f ./scans/verification-report.json ]; then
            VERIFY_ARGS=(--report ./scans/verification-report.json)
          fi

          LATEST_REMEDIATION=$(ls -1 ./remediations/remediation-plan-round-*.json 2>/dev/null | sort -V | tail -n 1 || true)
          REMEDIATION_ARGS=()
          if [ -n "$LATEST_REMEDIATION" ] && [ -f "$LATEST_REMEDIATION" ]; then
            REMEDIATION_ARGS=(--remediation-plan "$LATEST_REMEDIATION")
          fi

          DRY_RUN_ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            if [ -n "${GHEC_TARGET_TOKEN:-}" ]; then
              DRY_RUN_ARGS=(--dry-run --force-push)
            else
              DRY_RUN_ARGS=(--dry-run --skip-push)
            fi
          fi

          echo "Publishing 3-tier migration audit results repository (migration-audit-results) to target organization..."
          node ./apps/cli/bin/ghec-consultant-cli.mjs publish-results \
            --scope "$EFFECTIVE_SCOPE" \
            --execution-reports "$EXEC_REPORTS" \
            "${VERIFY_ARGS[@]}" \
            "${REMEDIATION_ARGS[@]}" \
            --evidence-dir ./scans,./downloaded-slicer/scans,./downloaded-cohorts,./remediations \
            --repo-name migration-audit-results \
            --output-dir ./scans/audit-results-repo \
            --append-step-summary \
            --verbose \
            "${DRY_RUN_ARGS[@]}" || true

      - name: Generate Final Audit & Step Summary
        if: always()
        shell: bash
        run: |
          echo "## Autonomous Migration & Self-Healing Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Scope**: \`${{ inputs.scope }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry Run**: \`${{ inputs.dry_run }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Auto Remediate**: \`${{ inputs.auto_remediate }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f ./scans/verification-report.json ]; then
            TOTAL_DISC=$(jq '.summary.discrepancyCount // .summary.totalDiscrepancies // 0' ./scans/verification-report.json)
            VERIFIED_MODS=$(jq '.summary.verifiedModuleCount // 0' ./scans/verification-report.json)
            UNVERIFIED_MODS=$(jq '.summary.unverifiedModuleCount // 0' ./scans/verification-report.json)
            PASS_RATE=$(jq -r '.summary.overallStatus // (if (.summary.discrepancyCount // 0) == 0 and (.summary.unverifiedModuleCount // 0) == 0 then "verified" else "failed" end)' ./scans/verification-report.json)
            echo "### Verification State" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Overall Status**: \`$PASS_RATE\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Verified Modules**: \`$VERIFIED_MODS\` (\`$UNVERIFIED_MODS\` unverified)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Remaining Discrepancies**: \`$TOTAL_DISC\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -d ./remediations ]; then
            echo "### Remediation History" >> "$GITHUB_STEP_SUMMARY"
            REM_COUNT=0
            for f in ./remediations/*.json; do
              [ -e "$f" ] || continue
              REM_COUNT=$((REM_COUNT + 1))
              ACT_CNT=$(jq '.actionableCount // (.actions | length) // 0' "$f" 2>/dev/null || echo 0)
              ACT_DESC=$(jq -r '[.actions[]? | "\(.moduleId) (\(.target)): \(.description)"] | join("; ")' "$f" 2>/dev/null || echo "")
              if [ -n "$ACT_DESC" ]; then
                echo "- Produced remediation plan: \`$f\` (\`$ACT_CNT\` action(s): $ACT_DESC)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- Produced remediation plan: \`$f\` (\`$ACT_CNT\` action(s))" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
            if [ "$REM_COUNT" -eq 0 ]; then
              echo "- No remediation rounds required (0 discrepancies on initial verification)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload Final Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-final-audit-${{ github.run_id }}
          path: |
            ./scans/
            ./remediations/
          retention-days: 30

      - name: Strict Verification & Execution Gate
        id: strict-gate
        if: always()
        shell: bash
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_AUTO_REMEDIATE: ${{ inputs.auto_remediate }}
        run: |
          GATE_FAILED=0

          if [ -f ./scans/aggregated-cohort-failures.json ]; then
            MISSING_COHORTS=$(jq '.missingCohortReports // 0' ./scans/aggregated-cohort-failures.json)
            FAILED_COHORT_MODULES=$(jq '.failedModuleCount // 0' ./scans/aggregated-cohort-failures.json)
            if [ "$MISSING_COHORTS" -gt 0 ]; then
              echo "::error::$MISSING_COHORTS expected cohort execution report(s) were not produced."
              GATE_FAILED=1
            fi
            if [ "$INPUT_AUTO_REMEDIATE" != "true" ] && [ "$FAILED_COHORT_MODULES" -gt 0 ]; then
              echo "::error::Cohort execution reported $FAILED_COHORT_MODULES failed module(s) with auto_remediate disabled."
              GATE_FAILED=1
            fi
          else
            echo "::error::Aggregated cohort failures report (./scans/aggregated-cohort-failures.json) is missing."
            GATE_FAILED=1
          fi

          if [ "$INPUT_DRY_RUN" != "true" ]; then
            if [ ! -f ./scans/verification-report.json ]; then
              echo "::error::Verification report (./scans/verification-report.json) was not generated."
              GATE_FAILED=1
            else
              DISCREPANCIES=$(jq '.summary.discrepancyCount // .summary.totalDiscrepancies // 0' ./scans/verification-report.json)
              UNVERIFIED_MODULES=$(jq '.summary.unverifiedModuleCount // .summary.failedModules // 0' ./scans/verification-report.json)
              if [ "$DISCREPANCIES" -gt 0 ] || [ "$UNVERIFIED_MODULES" -gt 0 ]; then
                echo "::error::Strict Verification Gate Failed: $DISCREPANCIES discrepancy(ies) and $UNVERIFIED_MODULES unverified module(s) remain after self-healing."
                GATE_FAILED=1
              fi
            fi
          fi

          if [ "$GATE_FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "Strict Verification & Execution Gate passed."
