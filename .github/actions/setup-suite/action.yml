name: 'Set Up GHEC Consultant Suite'
description: 'Sets up Node.js, caches and installs npm dependencies, builds monorepo packages, and optionally installs the gh-gei CLI extension.'
author: 'GitHub Enterprise Cloud Migration Team'

inputs:
  node-version:
    description: 'Node.js version to set up'
    required: false
    default: '22'
  cache:
    description: 'Package manager cache type for actions/setup-node (e.g. "npm", or "" to disable)'
    required: false
    default: 'npm'
  install-dependencies:
    description: 'Whether to install monorepo dependencies via npm ci'
    required: false
    default: 'true'
  clean-install:
    description: 'Force clean npm ci execution even if node_modules already exists'
    required: false
    default: 'false'
  build:
    description: 'Whether to compile all monorepo packages via npm run build'
    required: false
    default: 'true'
  install-gei:
    description: 'Whether to verify and install the gh-gei GitHub CLI extension'
    required: false
    default: 'false'
  release-url:
    description: 'Optional URL to a prebuilt ghec-migration-kit-vX.Y.Z.tar.gz release archive to download instead of building from source'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Detect Standalone Release Kit or Monorepo Mode
      id: detect-mode
      shell: bash
      env:
        INPUT_RELEASE_URL: ${{ inputs.release-url }}
      run: |
        if [ -n "$INPUT_RELEASE_URL" ]; then
          echo "Downloading prebuilt GHEC Migration Release Kit from $INPUT_RELEASE_URL..."
          TMP_KIT="$(mktemp -d)"
          curl -fsSL "$INPUT_RELEASE_URL" -o "$TMP_KIT/kit.tar.gz"
          tar -xzf "$TMP_KIT/kit.tar.gz" -C .
          rm -rf "$TMP_KIT"
        fi
        if [ -f "./bin/ghec-consultant-cli.mjs" ] && [ ! -d "./packages/migration/src" ]; then
          echo "is_standalone=true" >> "$GITHUB_OUTPUT"
          echo "cache_mode=" >> "$GITHUB_OUTPUT"
          echo "Detected standalone Customer Migration Release Kit (./bin/ghec-consultant-cli.mjs). Skipping npm ci and source build."
        else
          echo "is_standalone=false" >> "$GITHUB_OUTPUT"
          if [ -f "package-lock.json" ]; then
            echo "cache_mode=${{ inputs.cache }}" >> "$GITHUB_OUTPUT"
          else
            echo "cache_mode=" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ steps.detect-mode.outputs.cache_mode }}

    - name: Install Monorepo Dependencies
      if: ${{ inputs.install-dependencies == 'true' && steps.detect-mode.outputs.is_standalone != 'true' }}
      shell: bash
      run: |
        if [ ! -d "node_modules" ] || [ "${{ inputs.clean-install }}" = "true" ]; then
          npm ci
        fi

    - name: Build Monorepo Packages
      if: ${{ inputs.build == 'true' && steps.detect-mode.outputs.is_standalone != 'true' }}
      shell: bash
      run: |
        npm run build

    - name: Register CLI Binary on Runner PATH
      shell: bash
      run: |
        if [ -d "$PWD/bin" ]; then
          chmod +x "$PWD/bin/ghec-consultant-cli.mjs" 2>/dev/null || true
          ln -sf "$PWD/bin/ghec-consultant-cli.mjs" "$PWD/bin/ghec-consultant-cli" 2>/dev/null || true
          echo "$PWD/bin" >> "$GITHUB_PATH"
        fi
        if [ -d "$PWD/apps/cli/bin" ]; then
          chmod +x "$PWD/apps/cli/bin/ghec-consultant-cli.mjs" 2>/dev/null || true
          ln -sf "$PWD/apps/cli/bin/ghec-consultant-cli.mjs" "$PWD/apps/cli/bin/ghec-consultant-cli" 2>/dev/null || true
          echo "$PWD/apps/cli/bin" >> "$GITHUB_PATH"
        fi

    - name: Ensure GitHub Enterprise Importer (GEI) CLI Extension
      if: ${{ inputs.install-gei == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$HOME/.local/bin"
        export PATH="$HOME/.local/bin:$PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        if ! command -v gh >/dev/null 2>&1; then
          echo "Installing GitHub CLI (gh) into $HOME/.local/bin..."
          GH_VERSION="2.67.0"
          TMP_GH_DIR="$(mktemp -d)"
          if curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o "$TMP_GH_DIR/gh.tar.gz"; then
            tar -xzf "$TMP_GH_DIR/gh.tar.gz" -C "$TMP_GH_DIR"
            cp "$TMP_GH_DIR/gh_${GH_VERSION}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
            chmod +x "$HOME/.local/bin/gh"
          else
            echo "::warning::Failed to download GitHub CLI release tarball."
          fi
          rm -rf "$TMP_GH_DIR"
        fi
        if ! command -v gh >/dev/null 2>&1; then
          echo "::warning::GitHub CLI (gh) not found in runner PATH. GEI commands require gh."
        else
          gh --version || true
          if ! gh extension list | grep -q "gh gei"; then
            echo "Installing gh-gei extension..."
            gh extension install github/gh-gei || echo "::warning::Failed to install gh-gei extension via gh CLI."
          fi
          gh gei --version || true
        fi
