name: Mint GHEC GitHub App Token

on:
  workflow_call:
    inputs:
      scope_type:
        description: 'Target scope type: organization or enterprise'
        required: false
        type: string
        default: 'organization'
      scope_name:
        description: 'Target organization name or enterprise slug'
        required: true
        type: string
    secrets:
      app_id:
        description: 'GitHub App ID'
        required: true
      private_key:
        description: 'GitHub App Private Key (PEM format)'
        required: true
    outputs:
      token:
        description: 'Installation access token'
        value: ${{ jobs.mint.outputs.token }}
      installation_id:
        description: 'GitHub App installation ID'
        value: ${{ jobs.mint.outputs.installation_id }}

permissions:
  contents: read

jobs:
  mint:
    name: Mint Installation Token
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.token-gen.outputs.token }}
      installation_id: ${{ steps.token-gen.outputs.installation-id }}
    steps:
      - name: Mint Organization Installation Token
        if: ${{ inputs.scope_type == 'organization' }}
        id: org-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.private_key }}
          owner: ${{ inputs.scope_name }}

      - name: Mint Enterprise Installation Token
        if: ${{ inputs.scope_type == 'enterprise' }}
        id: ent-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.private_key }}
          enterprise: ${{ inputs.scope_name }}

      - name: Set Token Outputs
        id: token-gen
        run: |
          if [ "${{ inputs.scope_type }}" = "enterprise" ]; then
            echo "token=${{ steps.ent-token.outputs.token }}" >> "$GITHUB_OUTPUT"
            echo "installation-id=${{ steps.ent-token.outputs.installation-id }}" >> "$GITHUB_OUTPUT"
          else
            echo "token=${{ steps.org-token.outputs.token }}" >> "$GITHUB_OUTPUT"
            echo "installation-id=${{ steps.org-token.outputs.installation-id }}" >> "$GITHUB_OUTPUT"
          fi
