name: Test Migration Dispatch (Zero Local Secrets)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Path to migration scope JSON file'
        required: true
        type: string
        default: 'scopes/demogxp-wave.json'
      cached_bundle:
        description: 'Optional path to pre-collected discovery bundle JSON file'
        required: false
        type: string
        default: 'bundles/demogxp-discovery-bundle.json'
      modules:
        description: 'Comma-separated migration modules to execute (or "all")'
        required: false
        type: string
        default: 'all'
      dry_run:
        description: 'Execute in dry-run mode (simulates planning & mutations without modifying destination)'
        required: false
        type: boolean
        default: true
      continue_on_error:
        description: 'Continue executing remaining modules on non-fatal failures'
        required: false
        type: boolean
        default: true
      runner_labels:
        description: 'Runner label(s) for execution'
        required: false
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test-migration:
    name: 'Test Migration Run'
    runs-on: ${{ inputs.runner_labels }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Validate Migration Scope
        shell: bash
        run: |
          if [ ! -f "${{ inputs.scope }}" ]; then
            echo "::error::Scope file '${{ inputs.scope }}' does not exist."
            exit 1
          fi
          echo "Validating migration scope: ${{ inputs.scope }}"
          node --input-type=module -e '
            import { validateMigrationScope } from "./packages/contracts/dist/index.js";
            import fs from "fs";
            const parsed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const res = validateMigrationScope(parsed);
            if (!res.success) {
              console.error("Scope validation failed:", JSON.stringify(res.error, null, 2));
              process.exit(1);
            }
            console.log("Scope schema validation passed successfully.");
          ' "${{ inputs.scope }}"

      - name: Execute Preflight Evaluation & Credential Audit
        id: preflight
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          INPUT_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
        run: |
          mkdir -p ./scans
          echo "Evaluating source and target preflight readiness..."
          INPUT_ARG=()
          if [ -n "${{ inputs.cached_bundle }}" ] && [ -f "${{ inputs.cached_bundle }}" ]; then
            INPUT_ARG=(--input "${{ inputs.cached_bundle }}")
          fi

          EXIT_CODE=0
          node ./apps/cli/bin/ghec-consultant-cli.mjs preflight \
            --scope "${{ inputs.scope }}" \
            "${INPUT_ARG[@]}" \
            --output ./scans/test-preflight-report.json \
            --verbose || EXIT_CODE=$?

          if [ "$EXIT_CODE" -ne 0 ]; then
            if [ "$INPUT_CONTINUE_ON_ERROR" = "true" ]; then
              echo "::warning::Preflight evaluation detected repository blockers or warnings (exit code $EXIT_CODE), but continue_on_error is enabled. Proceeding to migration planning."
            else
              echo "::error::Preflight evaluation detected blockers (exit code $EXIT_CODE)."
              exit "$EXIT_CODE"
            fi
          fi

      - name: Execute Migration Planning
        id: plan
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
        run: |
          mkdir -p ./scans

          INPUT_ARG=()
          if [ -n "${{ inputs.cached_bundle }}" ] && [ -f "${{ inputs.cached_bundle }}" ]; then
            INPUT_ARG=(--input "${{ inputs.cached_bundle }}")
          fi

          echo "Generating migration plan for scope '${{ inputs.scope }}'..."
          node ./apps/cli/bin/ghec-consultant-cli.mjs plan \
            --scope "${{ inputs.scope }}" \
            "${INPUT_ARG[@]}" \
            --modules "${{ inputs.modules }}" \
            --output ./scans/test-migration-plan.json \
            --verbose

          if [ ! -f ./scans/test-migration-plan.json ]; then
            echo "::error::Migration plan ./scans/test-migration-plan.json was not generated."
            exit 1
          fi

      - name: Ensure GitHub Enterprise Importer (GEI) CLI Extension
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! gh extension list | grep -q "gh gei"; then
            echo "Installing gh-gei extension..."
            gh extension install github/gh-gei
          fi
          gh gei --version || true

      - name: Execute Migration
        id: migrate
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          INPUT_MODULES: ${{ inputs.modules }}
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          mkdir -p ./scans ./migrations

          DRY_RUN_ARG=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN_ARG=(--dry-run)
          fi

          CONT_ARG=()
          if [ "$INPUT_CONTINUE_ON_ERROR" = "true" ]; then
            CONT_ARG=(--continue-on-error)
          fi

          INPUT_ARG=()
          if [ -n "${{ inputs.cached_bundle }}" ] && [ -f "${{ inputs.cached_bundle }}" ]; then
            INPUT_ARG=(--input "${{ inputs.cached_bundle }}")
          fi

          echo "Executing migration for scope '$INPUT_SCOPE' (dry_run: $INPUT_DRY_RUN)..."
          EXIT_CODE=0
          node ./apps/cli/bin/ghec-consultant-cli.mjs migrate \
            --plan ./scans/test-migration-plan.json \
            --scope "$INPUT_SCOPE" \
            "${INPUT_ARG[@]}" \
            --modules "$INPUT_MODULES" \
            "${DRY_RUN_ARG[@]}" \
            "${CONT_ARG[@]}" \
            --output ./scans/test-migration-execution.json || EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 0 ] || ([ "$EXIT_CODE" -eq 4 ] && [ "$INPUT_CONTINUE_ON_ERROR" = "true" ]); then
            echo "Migration step completed with status code $EXIT_CODE."
          else
            echo "Migration step failed with status code $EXIT_CODE."
            exit "$EXIT_CODE"
          fi

      - name: Execute Target Verification
        if: always()
        id: verify
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          mkdir -p ./scans

          if [ -f ./scans/test-migration-plan.json ]; then
            echo "Running post-migration verification against target enterprise..."
            node ./apps/cli/bin/ghec-consultant-cli.mjs verify \
              --plan ./scans/test-migration-plan.json \
              --scope "$INPUT_SCOPE" \
              --output ./scans/test-verification-report.json || {
                echo "Verification detected discrepancies or differences."
              }
          fi

      - name: Generate Actions Step Summary
        if: always()
        id: summary
        shell: bash
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MODULES: ${{ inputs.modules }}
        run: |
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          echo "## 🧪 Test Migration Execution Summary" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "- **Scope:** \`$INPUT_SCOPE\`" >> "$SUMMARY_FILE"
          echo "- **Modules:** \`$INPUT_MODULES\`" >> "$SUMMARY_FILE"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "- **Mode:** 🛡️ **Dry-Run (Zero Mutations - Safe)**" >> "$SUMMARY_FILE"
          else
            echo "- **Mode:** ⚡ **Live Apply (Mutations Allowed)**" >> "$SUMMARY_FILE"
          fi
          echo "- **Security Boundary:** 🔒 Zero Local Secrets (Tokens supplied via GitHub Secrets)" >> "$SUMMARY_FILE"
          echo "- **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          if [ -f ./scans/test-migration-plan.json ]; then
            echo "### 📋 Planned Operations" >> "$SUMMARY_FILE"
            TOTAL_OPS=$(jq '[.modules[].operations | length] | add // 0' ./scans/test-migration-plan.json)
            CREATES=$(jq '[.modules[].operations[] | select(.operation == "create")] | length' ./scans/test-migration-plan.json)
            UPDATES=$(jq '[.modules[].operations[] | select(.operation == "update")] | length' ./scans/test-migration-plan.json)
            NOOPS=$(jq '[.modules[].operations[] | select(.operation == "noop")] | length' ./scans/test-migration-plan.json)
            WARNINGS=$(jq '[.modules[].warnings | length] | add // 0' ./scans/test-migration-plan.json)

            echo "| Total Operations | Creates | Updates | No-ops | Warnings |" >> "$SUMMARY_FILE"
            echo "| :---: | :---: | :---: | :---: | :---: |" >> "$SUMMARY_FILE"
            echo "| **$TOTAL_OPS** | $CREATES | $UPDATES | $NOOPS | $WARNINGS |" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
          fi

          if [ -f ./scans/test-migration-execution.json ]; then
            echo "### 🚀 Execution Breakdown" >> "$SUMMARY_FILE"
            STATUS=$(jq -r '.status // "unknown"' ./scans/test-migration-execution.json)
            SUCCEEDED=$(jq '[.moduleResults[].results[] | select(.status == "succeeded")] | length' ./scans/test-migration-execution.json 2>/dev/null || echo 0)
            FAILED=$(jq '[.moduleResults[].results[] | select(.status == "failed")] | length' ./scans/test-migration-execution.json 2>/dev/null || echo 0)

            STATUS_BADGE="❓ $STATUS"
            if [ "$STATUS" = "complete" ]; then
              STATUS_BADGE="✅ Complete"
            elif [ "$STATUS" = "partial" ]; then
              STATUS_BADGE="⚠️ Partial"
            elif [ "$STATUS" = "failed" ]; then
              STATUS_BADGE="❌ Failed"
            fi

            echo "| Overall Status | Succeeded | Failed |" >> "$SUMMARY_FILE"
            echo "| :---: | :---: | :---: |" >> "$SUMMARY_FILE"
            echo "| $STATUS_BADGE | $SUCCEEDED | $FAILED |" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
          fi

          if [ -f ./scans/test-verification-report.json ]; then
            echo "### 🔍 Post-Migration Verification" >> "$SUMMARY_FILE"
            VERIFIED=$(jq -r '.verified // false' ./scans/test-verification-report.json)
            DISCREPANCIES=$(jq -r '.totalDiscrepancies // (.discrepancies | length) // 0' ./scans/test-verification-report.json)

            if [ "$VERIFIED" = "true" ]; then
              echo "✅ **Target state strictly verified with 0 discrepancies.**" >> "$SUMMARY_FILE"
            else
              echo "> [!WARNING]" >> "$SUMMARY_FILE"
              echo "> **Verification detected $DISCREPANCIES discrepancy(ies). (Expected during dry-run before live apply).**" >> "$SUMMARY_FILE"
            fi
            echo "" >> "$SUMMARY_FILE"
          fi

      - name: Agentic Remediation Review
        id: agent-review
        if: always()
        shell: bash
        run: |
          if [ -f ./scans/test-verification-report.json ]; then
            echo "Running Agentic Remediation Review against verification report..."
            node ./apps/cli/bin/ghec-consultant-cli.mjs agent-review \
              --report ./scans/test-verification-report.json \
              --spec docs/specs/verification-remediation-agent.md \
              --output ./scans/remediation-plan.json \
              --output-markdown ./scans/remediation-plan.md \
              --append-step-summary || {
                echo "::warning::Agent review completed with warnings or failed."
              }
          fi

      - name: Publish Migration Results Repository to Target Organization
        id: publish-results
        if: always()
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mkdir -p ./scans/results-repo
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          EXEC_FLAG=""
          if [ -f ./scans/test-migration-execution.json ]; then
            EXEC_FLAG="--execution-report ./scans/test-migration-execution.json"
          fi

          VERIFY_FLAG=""
          if [ -f ./scans/test-verification-report.json ]; then
            VERIFY_FLAG="--verification-report ./scans/test-verification-report.json"
          fi

          REMEDIATION_FLAG=""
          if [ -f ./scans/remediation-plan.json ]; then
            REMEDIATION_FLAG="--remediation-plan ./scans/remediation-plan.json"
          fi

          node ./apps/cli/bin/ghec-consultant-cli.mjs publish-results \
            $EXEC_FLAG \
            --scope "${{ inputs.scope }}" \
            $VERIFY_FLAG \
            $REMEDIATION_FLAG \
            --output-dir ./scans/results-repo \
            --append-step-summary \
            $DRY_RUN_FLAG || {
              echo "::warning::Publishing migration results repository encountered non-fatal issues."
            }

      - name: Upload Test Migration Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-migration-artifacts-${{ github.run_id }}
          path: |
            ./scans/test-preflight-report.json
            ./scans/test-migration-plan.json
            ./scans/test-migration-execution.json
            ./scans/test-verification-report.json
            ./scans/remediation-plan.*
            ./scans/results-repo
          retention-days: 14
