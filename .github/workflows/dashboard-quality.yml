name: Dashboard quality

on:
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - 'packages/analysis/**'
      - 'packages/contracts/**'
      - 'fixtures/synthetic/**'
      - 'package*.json'
      - '.github/workflows/dashboard-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build shared workspace packages
        run: npm run build -w @ghec/contracts && npm run build -w @ghec/analysis
      - name: Type-check dashboard
        run: npm run typecheck -w @ghec/dashboard
      - name: Build dashboard
        run: npm run build -w @ghec/dashboard
      - name: Run dashboard interaction and accessibility tests
        run: npm run test:e2e -w @ghec/dashboard
      - name: Run dashboard visual regression tests
        run: npm run test:visual -w @ghec/dashboard
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-playwright-report
          path: |
            apps/dashboard/playwright-report
            apps/dashboard/test-results
          retention-days: 14
