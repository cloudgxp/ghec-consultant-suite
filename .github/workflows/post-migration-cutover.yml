name: Post-Migration Source-Detach Cutover

on:
  workflow_dispatch:
    inputs:
      source_org:
        description: 'Source GitHub organization to detach source-locked items from'
        required: true
        type: string
      target_org:
        description: 'Target GitHub organization to migrate detached items into'
        required: true
        type: string
      scope_file:
        description: 'Optional path to MigrationScope JSON file (e.g. scopes/wave-1.json)'
        required: false
        type: string
        default: ''
      scope_run_id:
        description: 'Optional GitHub Actions Run ID from generate-scope.yml (or "latest") to download migration-scopes artifact'
        required: false
        type: string
        default: ''
      repos:
        description: 'Optional comma-separated list of repository names to cut over'
        required: false
        type: string
        default: ''
      include_deploy_keys:
        description: 'Detach SSH deploy keys from source and recreate on target (with auto-rollback)'
        required: false
        type: boolean
        default: true
      include_pages_cname:
        description: 'Detach GitHub Pages custom CNAME domain from source and bind on target (with auto-rollback)'
        required: false
        type: boolean
        default: true
      reclaim_mannequins:
        description: 'Reclaim EMU mannequins in target organization using mannequin-mapping.csv (--skip-invitation)'
        required: false
        type: boolean
        default: false
      mannequin_csv_path:
        description: 'Optional path to mannequin-mapping.csv (if blank, automatically downloads from migration-audit-results in target_org)'
        required: false
        type: string
        default: ''
      deactivate_source_webhooks:
        description: 'Deactivate active webhooks on source repositories and organization to prevent duplicate deliveries'
        required: false
        type: boolean
        default: false
      disable_source_actions:
        description: 'Disable GitHub Actions on source repositories so scheduled workflows stop running on source'
        required: false
        type: boolean
        default: false
      archive_source_repos:
        description: 'Archive source repositories (read-only) after cutover completes'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Simulate cutover operations without mutating source or target organizations'
        required: false
        type: boolean
        default: false
      confirm_cutover:
        description: 'Type CUTOVER to confirm live source detachment and cutover actions (ignored when dry_run=true)'
        required: true
        type: string
        default: 'CUTOVER'

permissions:
  contents: read
  actions: read

jobs:
  cutover:
    name: 'Execute Post-Migration Source-Detach Cutover'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Suite Environment
        uses: ./.github/actions/setup-suite
        with:
          install-gei: ${{ inputs.reclaim_mannequins && 'true' || 'false' }}

      - name: Verify Cutover Safety Guardrails
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm_cutover }}
          SOURCE_ORG: ${{ inputs.source_org }}
          TARGET_ORG: ${{ inputs.target_org }}
        run: |
          if [ -z "$SOURCE_ORG" ] || [ -z "$TARGET_ORG" ]; then
            echo "::error::Both source_org and target_org must be provided."
            exit 1
          fi

          if [ "$DRY_RUN" != "true" ] && [ "$CONFIRM" != "CUTOVER" ]; then
            echo "::error::Live post-migration cutover requires confirm_cutover=CUTOVER (or set dry_run=true to preview)."
            exit 1
          fi

      - name: Resolve Optional Scope Artifact
        if: ${{ inputs.scope_run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOPE_RUN_ID: ${{ inputs.scope_run_id }}
        run: |
          mkdir -p ./downloaded-scope
          SRUN="$SCOPE_RUN_ID"
          if [ "$SRUN" = "latest" ]; then
            SRUN=$(gh run list --workflow=generate-scope.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
          fi
          if [ -n "$SRUN" ]; then
            gh run download "$SRUN" -n migration-scopes --dir ./downloaded-scope || true
          fi

      - name: Execute Post-Migration Cutover
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          SOURCE_ORG: ${{ inputs.source_org }}
          TARGET_ORG: ${{ inputs.target_org }}
          SCOPE_FILE: ${{ inputs.scope_file }}
          REPOS: ${{ inputs.repos }}
          INCLUDE_DEPLOY_KEYS: ${{ inputs.include_deploy_keys }}
          INCLUDE_PAGES_CNAME: ${{ inputs.include_pages_cname }}
          DEACTIVATE_WEBHOOKS: ${{ inputs.deactivate_source_webhooks }}
          DISABLE_ACTIONS: ${{ inputs.disable_source_actions }}
          ARCHIVE_REPOS: ${{ inputs.archive_source_repos }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mkdir -p ./scans

          EFFECTIVE_SCOPE="$SCOPE_FILE"
          if [ -z "$EFFECTIVE_SCOPE" ] && [ -d "./downloaded-scope" ]; then
            EFFECTIVE_SCOPE=$(find ./downloaded-scope -name '*.json' 2>/dev/null | sort | head -n 1 || true)
          fi

          ARGS=(
            cutover
            --source-org "$SOURCE_ORG"
            --target-org "$TARGET_ORG"
            --output ./scans/cutover-report.json
            --append-step-summary
          )

          if [ -n "$EFFECTIVE_SCOPE" ] && [ -f "$EFFECTIVE_SCOPE" ]; then
            ARGS+=(--scope "$EFFECTIVE_SCOPE")
          fi

          if [ -n "$REPOS" ]; then
            ARGS+=(--repos "$REPOS")
          fi

          if [ "$INCLUDE_DEPLOY_KEYS" = "true" ]; then
            ARGS+=(--include-deploy-keys)
          else
            ARGS+=(--no-include-deploy-keys)
          fi

          if [ "$INCLUDE_PAGES_CNAME" = "true" ]; then
            ARGS+=(--include-pages-cname)
          else
            ARGS+=(--no-include-pages-cname)
          fi

          if [ "$DEACTIVATE_WEBHOOKS" = "true" ]; then
            ARGS+=(--deactivate-source-webhooks)
          fi

          if [ "$DISABLE_ACTIONS" = "true" ]; then
            ARGS+=(--disable-source-actions)
          fi

          if [ "$ARCHIVE_REPOS" = "true" ]; then
            ARGS+=(--archive-source-repos)
          fi

          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          node ./apps/cli/bin/ghec-consultant-cli.mjs "${ARGS[@]}"

      - name: Reclaim EMU Mannequins (Optional)
        if: ${{ inputs.reclaim_mannequins == true }}
        shell: bash
        env:
          GH_PAT: ${{ secrets.GHEC_TARGET_TOKEN }}
          GH_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          TARGET_ORG: ${{ inputs.target_org }}
          CSV_PATH_INPUT: ${{ inputs.mannequin_csv_path }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p ./scans
          CSV_FILE="$CSV_PATH_INPUT"
          if [ -z "$CSV_FILE" ] || [ ! -f "$CSV_FILE" ]; then
            echo "Fetching mannequin-mapping.csv from ${TARGET_ORG}/migration-audit-results..."
            if gh api "repos/${TARGET_ORG}/migration-audit-results/contents/post-migration-care/mannequin-mapping.csv" -H "Accept: application/vnd.github.raw" > ./scans/mannequin-mapping.csv 2>/dev/null; then
              CSV_FILE="./scans/mannequin-mapping.csv"
            elif gh api "repos/${TARGET_ORG}/migration-audit-results/contents/mannequin-mapping.csv" -H "Accept: application/vnd.github.raw" > ./scans/mannequin-mapping.csv 2>/dev/null; then
              CSV_FILE="./scans/mannequin-mapping.csv"
            fi
          fi

          if [ -z "$CSV_FILE" ] || [ ! -f "$CSV_FILE" ]; then
            echo "::warning::No mannequin-mapping.csv found at '$CSV_PATH_INPUT' or in ${TARGET_ORG}/migration-audit-results. Generating fresh mannequin CSV from target organization..."
            gh gei generate-mannequin-csv --github-target-org "$TARGET_ORG" --output ./scans/mannequin-mapping.csv || true
            CSV_FILE="./scans/mannequin-mapping.csv"
          fi

          if [ -f "$CSV_FILE" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "### DRY-RUN MODE: Mannequin Mapping CSV Preview ($CSV_FILE)"
              cat "$CSV_FILE"
            else
              echo "Reclaiming EMU mannequins in $TARGET_ORG using $CSV_FILE (--skip-invitation)..."
              gh gei reclaim-mannequin \
                --github-target-org "$TARGET_ORG" \
                --csv "$CSV_FILE" \
                --skip-invitation || {
                  echo "::warning::One or more mannequin reclamations reported warnings."
                }
            fi
          fi

      - name: Upload Cutover Execution Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-migration-cutover-report-${{ github.run_id }}
          path: |
            ./scans/cutover-report.json
            ./scans/mannequin-mapping.csv
          if-no-files-found: ignore
