name: Resume Interrupted Migration

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Migration Run ID to resume from checkpoint (or "latest")'
        required: true
        type: string
        default: 'latest'
      workflow_run_id:
        description: 'GitHub Actions Run ID of interrupted migration run to download checkpoint artifacts from (optional if on persistent runner)'
        required: false
        type: string
        default: ''
      scope:
        description: 'Optional path to original migration scope file (if re-specifying scope)'
        required: false
        type: string
        default: ''
      modules:
        description: 'Optional subset of modules to resume (or empty for all remaining in checkpoint)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Execute resume in dry-run simulation mode'
        required: false
        type: boolean
        default: true
      continue_on_error:
        description: 'Continue executing remaining modules on non-fatal failures'
        required: false
        type: boolean
        default: true
      runner_labels:
        description: 'Runner label(s) for runner selection (e.g. "ubuntu-latest" or "self-hosted,linux")'
        required: false
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  resume:
    name: 'Resume Run: ${{ inputs.run_id }}'
    runs-on: ${{ inputs.runner_labels }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Suite Environment
        uses: ./.github/actions/setup-suite
        with:
          install-gei: 'true'

      - name: Locate or Restore Checkpoint Directory
        id: checkpoint-restore
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          mkdir -p ./migrations ./scans

          # 1. If workflow_run_id is provided, download artifacts directly
          TARGET_RUN_ID="$INPUT_WORKFLOW_RUN_ID"

          # 2. If workflow_run_id was not provided, look for the most recent run of migration-execute-wave.yml
          if [ -z "$TARGET_RUN_ID" ] && ! ls -d ./migrations/.checkpoint-* 1> /dev/null 2>&1; then
            echo "Searching for latest migration-execute-wave workflow run to retrieve checkpoints..."
            RECENT_RUN=$(gh run list --workflow migration-execute-wave.yml --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
            if [ -n "$RECENT_RUN" ] && [ "$RECENT_RUN" != "null" ]; then
              echo "Detected latest execution run ID: $RECENT_RUN"
              TARGET_RUN_ID="$RECENT_RUN"
            fi
          fi

          if [ -n "$TARGET_RUN_ID" ]; then
            echo "Attempting to download checkpoint artifacts from GitHub Actions run $TARGET_RUN_ID..."
            mkdir -p ./temp_artifacts
            if gh run download "$TARGET_RUN_ID" --dir ./temp_artifacts 2>/dev/null; then
              echo "Downloaded run artifacts. Scanning for checkpoint directories..."
              find ./temp_artifacts -type d -name '.checkpoint-*' | while read -r CP_DIR; do
                echo "Restoring checkpoint: $(basename "$CP_DIR")"
                cp -r "$CP_DIR" ./migrations/
              done
            else
              echo "::warning::Could not download artifacts from workflow run $TARGET_RUN_ID."
            fi
          fi

          # 3. Check if checkpoints now exist
          if ls -d ./migrations/.checkpoint-* 1> /dev/null 2>&1; then
            echo "Active checkpoints found in ./migrations/:"
            ls -la ./migrations/.checkpoint-*
          else
            echo "::warning::No local checkpoint directory (.checkpoint-*) found in ./migrations/."
            echo "If this is a fresh runner, specify 'workflow_run_id' input with the failed GitHub Actions run ID."
          fi

      - name: Execute Migration Resumption
        id: run-resume
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
        run: |
          ARGS=(migrate --resume "${{ inputs.run_id }}")

          if [ -n "${{ inputs.scope }}" ] && [ -f "${{ inputs.scope }}" ]; then
            ARGS+=(--scope "${{ inputs.scope }}")
          fi

          if [ -n "${{ inputs.modules }}" ]; then
            ARGS+=(--modules "${{ inputs.modules }}")
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          if [ "${{ inputs.continue_on_error }}" = "true" ]; then
            ARGS+=(--continue-on-error)
          fi

          OUTPUT_FILE="./scans/resumed-migration-report-${{ inputs.run_id }}.json"
          ARGS+=(--output "$OUTPUT_FILE")

          echo "Resuming migration with arguments: ${ARGS[*]}"
          node ./apps/cli/bin/ghec-consultant-cli.mjs "${ARGS[@]}"

      - name: Generate Resumption Summary
        if: always()
        shell: bash
        run: |
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          echo "## 🔄 Migration Resumption Summary" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "- **Target Run ID:** \`${{ inputs.run_id }}\`" >> "$SUMMARY_FILE"
          echo "- **Mode:** ${{ inputs.dry_run == true && '🧪 Dry-Run' || '⚡ Live Mutation' }}" >> "$SUMMARY_FILE"
          echo "- **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          REPORT=$(find ./scans -name 'resumed-migration-report-*.json' | head -n 1)
          if [ -f "$REPORT" ]; then
            STATUS=$(jq -r '.status // "unknown"' "$REPORT")
            TOTAL_OPS=$(jq '[.moduleResults[].results | length] | add // 0' "$REPORT")
            SUCCEEDED=$(jq '[.moduleResults[].results[] | select(.status == "succeeded")] | length' "$REPORT")
            FAILED=$(jq '[.moduleResults[].results[] | select(.status == "failed")] | length' "$REPORT")
            SKIPPED=$(jq '[.moduleResults[].results[] | select(.status == "skipped")] | length' "$REPORT")

            echo "### Outcome Overview" >> "$SUMMARY_FILE"
            echo "| Status | Succeeded | Failed | Skipped | Total Operations |" >> "$SUMMARY_FILE"
            echo "| :---: | :---: | :---: | :---: | :---: |" >> "$SUMMARY_FILE"
            echo "| **$STATUS** | $SUCCEEDED | $FAILED | $SKIPPED | $TOTAL_OPS |" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
          else
            echo "::warning::Resumed migration report was not generated." >> "$SUMMARY_FILE"
          fi

      - name: Upload Resumed Artifacts & Updated Checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-resumed-${{ inputs.run_id }}-${{ github.run_id }}
          path: |
            ./scans/resumed-migration-report-*.json
            ./migrations/
          retention-days: 14
