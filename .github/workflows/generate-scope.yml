name: Generate Migration Scope

on:
  workflow_dispatch:
    inputs:
      source_org:
        description: 'Source organization slug (e.g. source-org)'
        required: true
        type: string
      target_org:
        description: 'Target organization slug (e.g. target-emu)'
        required: true
        type: string
      scope_type:
        description: 'Repository selection mode'
        required: true
        type: choice
        options:
          - 'all_repositories'
          - 'urls_file'
          - 'custom_list'
          - 'org_resources_only'
        default: 'all_repositories'
      repos_file_path:
        description: 'Path to repository URLs file (if scope_type is urls_file, e.g. waves/wave1.txt)'
        required: false
        type: string
      repositories_list:
        description: 'Repository URLs or names (one per line or comma-separated, if scope_type is custom_list)'
        required: false
        type: string
      scope_name:
        description: 'Scope name / filename (without .json). Leave blank for default.'
        required: false
        type: string
      identity_suffix:
        description: 'EMU identity suffix (e.g. _antigravity)'
        required: false
        type: string
        default: '_antigravity'
      lfs_strategy:
        description: 'LFS migration strategy'
        required: false
        type: choice
        options:
          - 'dual-remote-stream'
          - 'skip'
        default: 'dual-remote-stream'
      target_visibility:
        description: 'Target repository visibility override'
        required: false
        type: choice
        options:
          - 'preserve'
          - 'public'
          - 'private'
          - 'internal'
        default: 'preserve'
      include_archived:
        description: 'Include archived repositories in scope'
        required: false
        type: boolean
        default: false
      target_repo_prefix:
        description: 'Optional prefix for target repository names'
        required: false
        type: string
        default: ''
      target_repo_suffix:
        description: 'Optional suffix for target repository names'
        required: false
        type: string
        default: ''
      skip_releases:
        description: 'Skip migrating releases/release assets for repositories'
        required: false
        type: boolean
        default: false
      commit_to_branch:
        description: 'Commit and push the generated scope file to this branch'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate-scope:
    name: 'Generate Scope: ${{ inputs.source_org }} -> ${{ inputs.target_org }}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Suite Environment
        uses: ./.github/actions/setup-suite

      - name: Generate Scope File
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GH_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
        run: |
          ARGS=(
            "--source" "${{ inputs.source_org }}"
            "--target" "${{ inputs.target_org }}"
            "--identity-suffix" "${{ inputs.identity_suffix }}"
            "--lfs-strategy" "${{ inputs.lfs_strategy }}"
          )

          if [ -n "${{ inputs.scope_name }}" ]; then
            ARGS+=("--name" "${{ inputs.scope_name }}")
          fi

          if [ "${{ inputs.target_visibility }}" != "preserve" ]; then
            ARGS+=("--target-visibility" "${{ inputs.target_visibility }}")
          fi

          if [ "${{ inputs.include_archived }}" = "true" ]; then
            ARGS+=("--include-archived")
          fi

          if [ -n "${{ inputs.target_repo_prefix }}" ]; then
            ARGS+=("--target-repo-prefix" "${{ inputs.target_repo_prefix }}")
          fi

          if [ -n "${{ inputs.target_repo_suffix }}" ]; then
            ARGS+=("--target-repo-suffix" "${{ inputs.target_repo_suffix }}")
          fi

          if [ "${{ inputs.skip_releases }}" = "true" ]; then
            ARGS+=("--skip-releases")
          fi

          if [ "${{ inputs.scope_type }}" = "all_repositories" ]; then
            ARGS+=("--all")
          elif [ "${{ inputs.scope_type }}" = "org_resources_only" ]; then
            ARGS+=("--org-only")
          elif [ "${{ inputs.scope_type }}" = "urls_file" ]; then
            if [ -z "${{ inputs.repos_file_path }}" ] || [ ! -f "${{ inputs.repos_file_path }}" ]; then
              echo "::error::repos_file_path is missing or file does not exist: '${{ inputs.repos_file_path }}'"
              exit 1
            fi
            ARGS+=("--file" "${{ inputs.repos_file_path }}")
          elif [ "${{ inputs.scope_type }}" = "custom_list" ]; then
            TMP_URLS_FILE=$(mktemp)
            echo "${{ inputs.repositories_list }}" > "$TMP_URLS_FILE"
            ARGS+=("--file" "$TMP_URLS_FILE")
          fi

          node scripts/generate-scope.mjs "${ARGS[@]}"

      - name: Upload Generated Scopes as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-scopes
          path: scopes/*.json
          retention-days: 14

      - name: Commit & Push Scope File
        if: ${{ inputs.commit_to_branch }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scopes/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(scope): generate migration scope for ${{ inputs.source_org }} -> ${{ inputs.target_org }}"
            git push origin HEAD
          fi

      - name: Generate Actions Step Summary
        if: always()
        shell: bash
        run: |
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          echo "## 📋 Migration Scope Generation Summary" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "- **Source:** \`${{ inputs.source_org }}\`" >> "$SUMMARY_FILE"
          echo "- **Target:** \`${{ inputs.target_org }}\`" >> "$SUMMARY_FILE"
          echo "- **Type:** \`${{ inputs.scope_type }}\`" >> "$SUMMARY_FILE"
          echo "- **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "Scope files in \`scopes/\` are validated and ready for \`migration-execute-wave.yml\`." >> "$SUMMARY_FILE"
