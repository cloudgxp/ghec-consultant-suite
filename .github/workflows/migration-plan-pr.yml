name: Migration Plan on Scope

on:
  workflow_dispatch:
    inputs:
      scope_path:
        description: 'Path to migration scope JSON file (or leave empty to plan all non-test scopes in scopes/ or downloaded artifact)'
        required: false
        default: ''
        type: string
      scope_run_id:
        description: 'Optional GitHub Actions Run ID from generate-scope.yml (or "latest") to download migration-scopes artifact'
        required: false
        default: ''
        type: string
      pr_number:
        description: 'Optional pull request number to post the planning summary comment to'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: migration-plan-${{ github.ref }}-${{ inputs.scope_path }}-${{ inputs.scope_run_id }}
  cancel-in-progress: true

jobs:
  plan-scopes:
    name: Generate Migration Plans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Suite Environment
        uses: ./.github/actions/setup-suite

      - name: Identify Target Scope Files
        id: find-scopes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SCOPE_PATH: ${{ inputs.scope_path }}
          INPUT_SCOPE_RUN_ID: ${{ inputs.scope_run_id }}
        run: |
          mkdir -p ./downloaded-scope
          if [ -n "$INPUT_SCOPE_RUN_ID" ]; then
            SRUN="$INPUT_SCOPE_RUN_ID"
            if [ "$SRUN" = "latest" ]; then
              SRUN=$(gh run list --workflow=generate-scope.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
            fi
            if [ -n "$SRUN" ]; then
              gh run download "$SRUN" -n migration-scopes --dir ./downloaded-scope || true
            fi
          fi
          if [ -n "$INPUT_SCOPE_PATH" ]; then
            if [ ! -f "$INPUT_SCOPE_PATH" ]; then
              echo "::error::Specified scope file not found: $INPUT_SCOPE_PATH"
              exit 1
            fi
            TARGETS="$INPUT_SCOPE_PATH"
          elif [ -d "./downloaded-scope" ] && [ -n "$(find ./downloaded-scope -name '*.json' 2>/dev/null)" ]; then
            TARGETS=$(find ./downloaded-scope -name '*.json' | sort || true)
          else
            TARGETS=$(find scopes -maxdepth 2 -name '*.json' ! -name 'test-*' | sort || true)
          fi
          if [ -z "$TARGETS" ]; then
            echo "No JSON scope files found."
            echo "has_scopes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Target scopes:"
          echo "$TARGETS"
          echo "has_scopes=true" >> "$GITHUB_OUTPUT"
          JSON_ARRAY=$(echo "$TARGETS" | jq -R . | jq -s -c .)
          echo "scopes_json=$JSON_ARRAY" >> "$GITHUB_OUTPUT"

      - name: Execute Migration Planning for Target Scopes
        if: ${{ steps.find-scopes.outputs.has_scopes == 'true' }}
        id: plan
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          SCOPES_JSON: ${{ steps.find-scopes.outputs.scopes_json }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          mkdir -p ./scans ./reports
          COMMENT_BODY="# 📋 Migration Planning Summary\n\n"
          COMMENT_BODY+="Automated pre-migration plan execution completed for target scopes.\n\n"

          echo "$SCOPES_JSON" | jq -r '.[]' | while read -r SCOPE_FILE; do
            if [ ! -f "$SCOPE_FILE" ]; then
              continue
            fi

            if [[ "$SCOPE_FILE" =~ ^scopes/test- ]] || grep -q '"example-source-org"' "$SCOPE_FILE"; then
              echo "Skipping test/example scope: $SCOPE_FILE"
              continue
            fi

            if ! jq -e 'has("organizations") and has("version")' "$SCOPE_FILE" >/dev/null 2>&1; then
              echo "Skipping non-scope JSON file: $SCOPE_FILE"
              continue
            fi

            BASENAME=$(basename "$SCOPE_FILE" .json)
            PLAN_OUTPUT="./scans/${BASENAME}-plan.json"

            echo "Generating plan for $SCOPE_FILE -> $PLAN_OUTPUT"

            # Execute plan CLI
            node ./apps/cli/bin/ghec-consultant-cli.mjs plan \
              --scope "$SCOPE_FILE" \
              --output "$PLAN_OUTPUT" || {
                echo "::error file=$SCOPE_FILE::Migration planning failed for $SCOPE_FILE"
                exit 1
              }

            # Extract metrics from plan
            if [ -f "$PLAN_OUTPUT" ]; then
              TOTAL_OPS=$(jq '[.modules[].operations | length] | add // 0' "$PLAN_OUTPUT")
              CREATE_OPS=$(jq '[.modules[].operations[] | select(.operation == "create")] | length' "$PLAN_OUTPUT")
              UPDATE_OPS=$(jq '[.modules[].operations[] | select(.operation == "update")] | length' "$PLAN_OUTPUT")
              NOOP_OPS=$(jq '[.modules[].operations[] | select(.operation == "noop")] | length' "$PLAN_OUTPUT")
              WARNING_COUNT=$(jq '[.modules[].warnings | length] | add // 0' "$PLAN_OUTPUT")

              SECTION="### Scope: \`$SCOPE_FILE\`\n\n"
              SECTION+="| Total Operations | Creates | Updates | No-ops | Warnings |\n"
              SECTION+="| :---: | :---: | :---: | :---: | :---: |\n"
              SECTION+="| **$TOTAL_OPS** | $CREATE_OPS | $UPDATE_OPS | $NOOP_OPS | $WARNING_COUNT |\n\n"

              if [ "$WARNING_COUNT" -gt 0 ]; then
                SECTION+="> [!WARNING]\n"
                SECTION+="> **Planning Warnings Detected ($WARNING_COUNT):**\n"
                WARNINGS=$(jq -r '.modules[].warnings[]?' "$PLAN_OUTPUT" | head -n 5 | sed 's/^/> - /')
                SECTION+="$WARNINGS\n\n"
              fi

              echo -e "$SECTION" >> ./reports/pr-comment.md

              RESULTS_OUT_DIR="./scans/results-repo-${BASENAME}"
              PUSH_ARGS=(--dry-run --skip-push)
              if [ -n "${GHEC_TARGET_TOKEN:-}" ]; then
                PUSH_ARGS=(--dry-run --force-push)
              fi
              node ./apps/cli/bin/ghec-consultant-cli.mjs publish-results \
                --scope "$SCOPE_FILE" \
                --plan "$PLAN_OUTPUT" \
                --evidence-dir ./scans \
                --output-dir "$RESULTS_OUT_DIR" \
                --append-step-summary \
                "${PUSH_ARGS[@]}" || {
                  echo "::warning::Generating post-care deliverables for $SCOPE_FILE encountered non-fatal issues."
                }
            fi
          done

          if [ -f ./reports/pr-comment.md ]; then
            cat ./reports/pr-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Migration Plan Artifacts
        if: ${{ steps.find-scopes.outputs.has_scopes == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-plans-${{ github.run_id }}
          path: |
            ./scans/*-plan.json
            ./scans/results-repo-*
          retention-days: 14

      - name: Post or Update PR Comment
        if: ${{ steps.find-scopes.outputs.has_scopes == 'true' && inputs.pr_number != '' && hashFiles('./reports/pr-comment.md') != '' }}
        uses: actions/github-script@v7
        env:
          TARGET_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = Number.parseInt(process.env.TARGET_PR_NUMBER || '', 10);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.info('No valid PR number provided; skipping PR comment.');
              return;
            }
            const commentBody = fs.readFileSync('./reports/pr-comment.md', 'utf8');
            const header = '## 📋 Migration Planning Summary';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(header)
            );

            const fullBody = `${header}\n\n${commentBody}\n\n*Generated by GHEC Consultant Suite automated preflight.*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: fullBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: fullBody
              });
            }

