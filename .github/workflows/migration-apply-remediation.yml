name: Dedicated Migration Self-Healing Remediation

on:
  workflow_dispatch:
    inputs:
      remediation_plan_path:
        description: 'Path to existing remediation-plan.json file (e.g. "scans/remediation-plan.json")'
        required: false
        type: string
        default: 'scans/remediation-plan.json'
      workflow_run_id:
        description: 'Optional GitHub Actions run_id from an earlier run to download remediation artifacts from'
        required: false
        type: string
        default: ''
      report_artifact:
        description: 'Optional artifact name (e.g. "migration-final-audit-<run_id>") from an earlier run'
        required: false
        type: string
        default: ''
      scope:
        description: 'Path to migration scope JSON file for re-verification (or filename inside scope artifact)'
        required: false
        type: string
        default: 'scopes/test-org-wave.json'
      scope_run_id:
        description: 'GitHub Actions run ID from Generate Migration Scope (or "latest") to download the scope artifact without committing to git'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Preview planned remediation actions without executing mutations'
        required: false
        type: boolean
        default: false
      target_environment:
        description: 'Target GitHub Environment with review protection gates'
        required: false
        type: string
        default: ''
      runner_labels:
        description: 'GitHub Actions runner label (e.g. "ubuntu-latest" or "self-hosted")'
        required: false
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  apply-remediation:
    name: Execute Targeted Remediation
    runs-on: ${{ inputs.runner_labels || 'ubuntu-latest' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Suite Environment
        uses: ./.github/actions/setup-suite

      - name: Download Prior Run Remediation Artifacts
        if: ${{ inputs.workflow_run_id != '' || inputs.report_artifact != '' || inputs.scope_run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID_INPUT: ${{ inputs.workflow_run_id }}
          ARTIFACT_INPUT: ${{ inputs.report_artifact }}
          SCOPE_RUN_ID: ${{ inputs.scope_run_id }}
        run: |
          mkdir -p ./downloaded-audit
          RUN_ID="$RUN_ID_INPUT"
          if [ "$RUN_ID" = "latest" ]; then
            RUN_ID=$(gh run list --workflow=migration-execute-wave.yml --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "$RUN_ID" ] && [ -n "$ARTIFACT_INPUT" ]; then
            RUN_ID="${ARTIFACT_INPUT##*-}"
          fi
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --dir ./downloaded-audit || true
          fi
          if [ -n "$SCOPE_RUN_ID" ]; then
            mkdir -p ./downloaded-scope
            SRUN="$SCOPE_RUN_ID"
            if [ "$SRUN" = "latest" ]; then
              SRUN=$(gh run list --workflow=generate-scope.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            fi
            if [ -n "$SRUN" ]; then
              gh run download "$SRUN" --dir ./downloaded-scope || true
            fi
          fi

      - name: Resolve Remediation Plan
        id: resolve-plan
        shell: bash
        run: |
          mkdir -p ./remediations
          PLAN_FILE="${{ inputs.remediation_plan_path }}"

          if [ -d "./downloaded-audit" ]; then
            LATEST_PLAN=$(find ./downloaded-audit -name "remediation-plan*.json" 2>/dev/null | sort | tail -n1)
            if [ -n "$LATEST_PLAN" ] && [ -f "$LATEST_PLAN" ]; then
              PLAN_FILE="$LATEST_PLAN"
            fi
          fi

          if [ ! -f "$PLAN_FILE" ]; then
            echo "::error::Remediation plan file '$PLAN_FILE' not found."
            exit 1
          fi

          echo "Using remediation plan: $PLAN_FILE"
          cp "$PLAN_FILE" ./remediations/active-remediation-plan.json

          ACTION_COUNT=$(jq '.actionableCount // 0' ./remediations/active-remediation-plan.json)
          echo "Discovered $ACTION_COUNT actionable items."

      - name: Execute Remediation Actions
        id: execute-remediation
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          PLAN_FILE="./remediations/active-remediation-plan.json"
          SCRIPT_CONTENT=$(jq -r '.script // ""' "$PLAN_FILE")

          if [ -z "$SCRIPT_CONTENT" ] || [ "$SCRIPT_CONTENT" = "null" ]; then
            echo "No executable script in remediation plan."
            exit 0
          fi

          echo "$SCRIPT_CONTENT" > ./remediations/apply-remediation.sh
          chmod +x ./remediations/apply-remediation.sh

          if [ "$DRY_RUN" = "true" ]; then
            echo "### DRY-RUN MODE: Preview of Remediation Script"
            cat ./remediations/apply-remediation.sh
          else
            echo "Executing live remediation script with target token..."
            set +e
            bash ./remediations/apply-remediation.sh 2>&1 | tee ./remediations/apply-remediation-execution.log
            REM_EXIT=${PIPESTATUS[0]}
            echo "Remediation script exited with code $REM_EXIT" | tee -a ./remediations/apply-remediation-execution.log
            set -e
          fi

      - name: Re-Verify Target Organization
        id: re-verify
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GHEC_TARGET_TOKEN: ${{ secrets.GHEC_TARGET_TOKEN }}
          SCOPE: ${{ inputs.scope }}
        run: |
          mkdir -p ./scans
          SCOPE_PATH="$SCOPE"
          if [ ! -f "$SCOPE_PATH" ] && [ -d "./downloaded-scope" ]; then
            CANDIDATE=$(find ./downloaded-scope -name "*.json" | head -n 1)
            if [ -n "$CANDIDATE" ]; then
              SCOPE_PATH="$CANDIDATE"
            fi
          fi
          if [ ! -f "$SCOPE_PATH" ] && [ -d "./downloaded-audit" ]; then
            CANDIDATE=$(find ./downloaded-audit -name "*scope*.json" | head -n 1)
            if [ -n "$CANDIDATE" ]; then
              SCOPE_PATH="$CANDIDATE"
            fi
          fi
          echo "Re-running verification to confirm discrepancy resolution using scope $SCOPE_PATH..."
          node ./apps/cli/bin/ghec-consultant-cli.mjs verify \
            --scope "$SCOPE_PATH" \
            --verbose \
            --output ./scans/post-remediation-verification.json || true

      - name: Generate Differential Audit Summary
        if: always()
        shell: bash
        run: |
          echo "## Dedicated Remediation Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Plan File**: \`${{ inputs.remediation_plan_path }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry Run**: \`${{ inputs.dry_run }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f ./scans/post-remediation-verification.json ]; then
            REMAINING=$(jq '.summary.discrepancyCount // .summary.totalDiscrepancies // 0' ./scans/post-remediation-verification.json)
            STATUS=$(jq '.summary.overallStatus // (if (.summary.discrepancyCount // 0) == 0 then "passed" else "failed" end)' ./scans/post-remediation-verification.json)
            echo "### Post-Remediation Target State" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Status**: \`$STATUS\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Remaining Discrepancies**: \`$REMAINING\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Remediation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-remediation-results-${{ github.run_id }}
          path: |
            ./remediations/
            ./scans/
          retention-days: 14

      - name: Strict Verification & Execution Gate
        id: strict-gate
        if: always()
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry-run mode enabled; skipping strict post-remediation verification gate."
            exit 0
          fi

          if [ ! -f ./scans/post-remediation-verification.json ]; then
            echo "::error::Post-remediation verification report (./scans/post-remediation-verification.json) was not generated."
            exit 1
          fi

          DISCREPANCIES=$(jq '.summary.discrepancyCount // .summary.totalDiscrepancies // 0' ./scans/post-remediation-verification.json)
          UNVERIFIED_MODULES=$(jq '.summary.unverifiedModuleCount // .summary.failedModules // 0' ./scans/post-remediation-verification.json)
          if [ "$DISCREPANCIES" -gt 0 ] || [ "$UNVERIFIED_MODULES" -gt 0 ]; then
            echo "::error::Strict Post-Remediation Verification Gate Failed: $DISCREPANCIES discrepancy(ies) and $UNVERIFIED_MODULES unverified module(s) remain."
            exit 1
          fi

          echo "Strict Post-Remediation Verification Gate passed."
