name: Generate Migration Scope

on:
  workflow_dispatch:
    inputs:
      source_org:
        description: 'Source organization slug, or comma-separated slugs for multi-org consolidation (e.g. "org-a,org-b")'
        required: true
        type: string
      target_org:
        description: 'Target organization slug (e.g. target-emu)'
        required: true
        type: string
      scope_type:
        description: 'Repository selection mode'
        required: true
        type: choice
        options:
          - 'all_repositories'
          - 'public_repositories_only'
          - 'private_repositories_only'
          - 'internal_repositories_only'
          - 'urls_file'
          - 'custom_list'
          - 'org_resources_only'
        default: 'all_repositories'
      source_visibility:
        description: 'Filter discovered source repositories by visibility ("all", "public", "private", or "internal")'
        required: false
        type: choice
        options:
          - 'all'
          - 'public'
          - 'private'
          - 'internal'
        default: 'all'
      exclude_forks:
        description: 'Exclude forked repositories when discovering organization repositories'
        required: false
        type: boolean
        default: false
      org_items_mode:
        description: 'Organization items mode ("auto" = all for 1:1 / associated-only for multi-org, "associated-only" = only items linked to in-scope repos, "all", or "none")'
        required: false
        type: choice
        options:
          - 'auto'
          - 'associated-only'
          - 'all'
          - 'none'
        default: 'auto'
      repos_file_path:
        description: 'Path to repository URLs file (if scope_type is urls_file, e.g. waves/wave1.txt)'
        required: false
        type: string
      repositories_list:
        description: 'Repository URLs or names (one per line or comma-separated, if scope_type is custom_list)'
        required: false
        type: string
      scope_name:
        description: 'Scope name / filename (without .json). Leave blank for default.'
        required: false
        type: string
      target_type:
        description: 'Target tenant type ("ghec" for standard GHEC, "emu" for Enterprise Managed Users)'
        required: false
        type: choice
        options:
          - 'ghec'
          - 'emu'
        default: 'ghec'
      emu_shortcode:
        description: 'Admin-defined EMU shortcode/suffix (e.g. "acme" or "_acme") — only used when target_type is "emu"'
        required: false
        type: string
        default: ''
      lfs_strategy:
        description: 'LFS migration strategy'
        required: false
        type: choice
        options:
          - 'dual-remote-stream'
          - 'skip'
        default: 'dual-remote-stream'
      target_visibility:
        description: 'Target repository visibility override'
        required: false
        type: choice
        options:
          - 'preserve'
          - 'public'
          - 'private'
          - 'internal'
        default: 'preserve'
      include_archived:
        description: 'Include archived repositories in scope'
        required: false
        type: boolean
        default: false
      target_repo_prefix:
        description: 'Optional prefix for target repository names (supports "{source}-" placeholder)'
        required: false
        type: string
        default: ''
      target_repo_suffix:
        description: 'Optional suffix for target repository names'
        required: false
        type: string
        default: ''
      skip_releases:
        description: 'Skip migrating releases/release assets for repositories'
        required: false
        type: boolean
        default: false
      mirror_push_mode:
        description: 'Mirror-push mode for massive (>2 GiB / >40 GiB) repos ("fast-snapshot" default vs "full-history")'
        required: false
        type: choice
        options:
          - 'fast-snapshot'
          - 'full-history'
        default: 'fast-snapshot'
      include_org_resources:
        description: 'Include organization-level migration modules in scope'
        required: false
        type: boolean
        default: true
      org_modules:
        description: 'Optional comma-separated list of org modules (leave blank for "auto" strategy resolution)'
        required: false
        type: string
        default: ''
      repo_modules:
        description: 'Optional comma-separated list of repository modules (leave blank for "auto" strategy resolution)'
        required: false
        type: string
        default: ''
      commit_to_branch:
        description: 'Optional: also commit and push the generated scope file to this git branch (artifacts are always uploaded)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-scope:
    name: 'Generate Scope: ${{ inputs.source_org }} -> ${{ inputs.target_org }}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Suite Environment
        uses: ./.github/actions/setup-suite

      - name: Generate Scope File
        id: gen
        shell: bash
        env:
          GHEC_SOURCE_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
          GH_TOKEN: ${{ secrets.GHEC_SOURCE_TOKEN }}
        run: |
          mkdir -p ./generated-scopes ./scopes
          EFFECTIVE_VIS="${{ inputs.source_visibility || 'all' }}"
          if [ "${{ inputs.scope_type }}" = "public_repositories_only" ]; then
            EFFECTIVE_VIS="public"
          elif [ "${{ inputs.scope_type }}" = "private_repositories_only" ]; then
            EFFECTIVE_VIS="private"
          elif [ "${{ inputs.scope_type }}" = "internal_repositories_only" ]; then
            EFFECTIVE_VIS="internal"
          fi

          SOURCE_LABEL="${{ inputs.source_org }}"
          if [[ "$SOURCE_LABEL" == *","* ]]; then
            SOURCE_LABEL="multi-org"
          fi

          SCOPE_BASENAME="${{ inputs.scope_name }}"
          if [ -z "$SCOPE_BASENAME" ]; then
            if [ "${{ inputs.scope_type }}" = "org_resources_only" ]; then
              SCOPE_BASENAME="${SOURCE_LABEL}-to-${{ inputs.target_org }}-org"
            elif [ "$EFFECTIVE_VIS" != "all" ]; then
              SCOPE_BASENAME="${SOURCE_LABEL}-to-${{ inputs.target_org }}-${EFFECTIVE_VIS}"
            elif [ "${{ inputs.scope_type }}" = "all_repositories" ]; then
              SCOPE_BASENAME="${SOURCE_LABEL}-to-${{ inputs.target_org }}-all"
            else
              SCOPE_BASENAME="${SOURCE_LABEL}-to-${{ inputs.target_org }}-wave"
            fi
          fi
          OUT_FILE="scopes/${SCOPE_BASENAME}.json"

          ARGS=(
            "generate-scope"
            "--source" "${{ inputs.source_org }}"
            "--target" "${{ inputs.target_org }}"
            "--name" "$SCOPE_BASENAME"
            "--output" "$OUT_FILE"
            "--target-type" "${{ inputs.target_type || 'ghec' }}"
            "--lfs-strategy" "${{ inputs.lfs_strategy }}"
            "--mirror-push-mode" "${{ inputs.mirror_push_mode || 'fast-snapshot' }}"
            "--include-org-resources" "${{ inputs.include_org_resources != false && 'true' || 'false' }}"
          )

          if [ -n "${{ inputs.org_items_mode }}" ] && [ "${{ inputs.org_items_mode }}" != "auto" ]; then
            ARGS+=("--org-items" "${{ inputs.org_items_mode }}")
          fi

          if [ -n "${{ inputs.emu_shortcode }}" ]; then
            ARGS+=("--emu-shortcode" "${{ inputs.emu_shortcode }}")
          fi

          if [ "${{ inputs.target_visibility }}" != "preserve" ]; then
            ARGS+=("--target-visibility" "${{ inputs.target_visibility }}")
          fi

          if [ "${{ inputs.include_archived }}" = "true" ]; then
            ARGS+=("--include-archived")
          fi

          if [ "${{ inputs.exclude_forks }}" = "true" ]; then
            ARGS+=("--exclude-forks")
          fi

          if [ -n "${{ inputs.target_repo_prefix }}" ]; then
            ARGS+=("--target-repo-prefix" "${{ inputs.target_repo_prefix }}")
          fi

          if [ -n "${{ inputs.target_repo_suffix }}" ]; then
            ARGS+=("--target-repo-suffix" "${{ inputs.target_repo_suffix }}")
          fi

          if [ "${{ inputs.skip_releases }}" = "true" ]; then
            ARGS+=("--skip-releases")
          fi

          if [ -n "${{ inputs.org_modules }}" ]; then
            ARGS+=("--org-modules" "${{ inputs.org_modules }}")
          fi

          if [ -n "${{ inputs.repo_modules }}" ]; then
            ARGS+=("--repo-modules" "${{ inputs.repo_modules }}")
          fi

          if [ "${{ inputs.scope_type }}" = "all_repositories" ] || [ "${{ inputs.scope_type }}" = "public_repositories_only" ] || [ "${{ inputs.scope_type }}" = "private_repositories_only" ] || [ "${{ inputs.scope_type }}" = "internal_repositories_only" ]; then
            ARGS+=("--all" "--source-visibility" "$EFFECTIVE_VIS")
          elif [ "${{ inputs.scope_type }}" = "org_resources_only" ]; then
            ARGS+=("--org-only")
          elif [ "${{ inputs.scope_type }}" = "urls_file" ]; then
            if [ -z "${{ inputs.repos_file_path }}" ] || [ ! -f "${{ inputs.repos_file_path }}" ]; then
              echo "::error::repos_file_path is missing or file does not exist: '${{ inputs.repos_file_path }}'"
              exit 1
            fi
            ARGS+=("--file" "${{ inputs.repos_file_path }}")
          elif [ "${{ inputs.scope_type }}" = "custom_list" ]; then
            TMP_URLS_FILE=$(mktemp)
            echo "${{ inputs.repositories_list }}" > "$TMP_URLS_FILE"
            ARGS+=("--file" "$TMP_URLS_FILE")
          fi

          node ./apps/cli/bin/ghec-consultant-cli.mjs "${ARGS[@]}"
          cp "$OUT_FILE" "./generated-scopes/${SCOPE_BASENAME}.json"
          echo "scope_file=$OUT_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Generated Scopes as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-scopes
          path: |
            generated-scopes/*.json
            scopes/*.json
          retention-days: 30

      - name: Commit & Push Scope File (Optional GitOps Mode)
        if: ${{ inputs.commit_to_branch == true }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.gen.outputs.scope_file }}"
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(scope): generate migration scope for ${{ inputs.source_org }} -> ${{ inputs.target_org }}"
            git push origin HEAD
          fi

      - name: Generate Actions Step Summary
        if: always()
        shell: bash
        env:
          GENERATED_FILE: ${{ steps.gen.outputs.scope_file }}
        run: |
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          echo "## 📋 Migration Scope Generation Summary" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "- **Source Organization:** \`${{ inputs.source_org }}\`" >> "$SUMMARY_FILE"
          echo "- **Target Organization:** \`${{ inputs.target_org }}\` (\`${{ inputs.target_type || 'ghec' }}\`)" >> "$SUMMARY_FILE"
          echo "- **Selection Mode:** \`${{ inputs.scope_type }}\` (Source Visibility: \`${{ inputs.source_visibility || 'all' }}\`)" >> "$SUMMARY_FILE"
          echo "- **Artifact Uploaded:** \`migration-scopes\` (Run ID: \`${{ github.run_id }}\`)" >> "$SUMMARY_FILE"
          if [ -f "$GENERATED_FILE" ]; then
            REPO_COUNT=$(jq '.repositories | length' "$GENERATED_FILE")
            ORG_MODS=$(jq -r '.organizations[0].modules | join(", ")' "$GENERATED_FILE")
            REPO_MODS=$(jq -r '.repositories[0].modules // [] | join(", ")' "$GENERATED_FILE")
            echo "- **Repositories in Scope:** \`$REPO_COUNT\`" >> "$SUMMARY_FILE"
            if [ "$ORG_MODS" = "auto" ] || [ -z "$ORG_MODS" ]; then
              echo "- **Organization Modules:** \`auto\` (all 15 organization modules)" >> "$SUMMARY_FILE"
            else
              echo "- **Organization Modules:** \`$ORG_MODS\`" >> "$SUMMARY_FILE"
            fi
            if [ "$REPO_MODS" = "auto" ] || [ -z "$REPO_MODS" ]; then
              echo "- **Repository Modules:** \`auto\` (all 19 repository modules, strategy-aware)" >> "$SUMMARY_FILE"
            else
              echo "- **Repository Modules:** \`$REPO_MODS\`" >> "$SUMMARY_FILE"
            fi
          fi
          echo "" >> "$SUMMARY_FILE"
          echo "### 🚀 Next Step: Run Dry-Run or Live Migration Wave" >> "$SUMMARY_FILE"
          echo "You can execute this scope immediately from the **Parallel Matrix Migration Wave** workflow using \`scope_run_id: latest\` (or \`${{ github.run_id }}\`):" >> "$SUMMARY_FILE"
          echo '```bash' >> "$SUMMARY_FILE"
          echo "gh workflow run migration-execute-wave.yml -f scope_run_id=\"${{ github.run_id }}\" -f dry_run=\"true\"" >> "$SUMMARY_FILE"
          echo '```' >> "$SUMMARY_FILE"
